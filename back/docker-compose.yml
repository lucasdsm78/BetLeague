version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: my_shared_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: betleague
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics status && nc -z localhost 5672"]
      interval: 5s
      timeout: 3s
      retries: 3

  backend:
    build: .
    container_name: fastapi_app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./:/app
    ports:
      - "8001:8001"
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/betleague
      RABBITMQ_URL: "amqp://user:password@rabbitmq:5672/"
    depends_on:
      - db
      - rabbitmq

  scrapper:
    build: ../ScrapperBet
    container_name: scrapper_app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../ScrapperBet:/app
    ports:
      - "8000:8000"
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/betleague
    depends_on:
      - backend
      - db

  score_consumer:
    build:
      context: .
      dockerfile: consumer_match_choice.Dockerfile
    container_name: score_consumer
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: always

  match_choice_consumer:
    build:
      context: .
      dockerfile: consumer_ticket.Dockerfile
    container_name: match_choice_consumer
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: always

volumes:
  db_data:
