# NATS server config - JetStream + TLS enabled
#
# Auth: fournie via --user / --pass dans docker-compose.yml
# TLS: mTLS avec vérification du certificat client
#
# Provisioning des streams:
# - fait via scripts/provision_jetstream_streams.py (service docker-compose: jetstream_provision)

port: 4222
http: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_mem: 256MB
  max_file: 1GB
}

tls {
  cert_file: "/etc/nats/certs/server-cert.pem"
  key_file:  "/etc/nats/certs/server-key.pem"
  ca_file:   "/etc/nats/certs/ca-cert.pem"
  verify:    true
  timeout:   2
}
