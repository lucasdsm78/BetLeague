<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00cc6a"/>
    </linearGradient>
  </defs>
  <!-- Full background for maskable (no rounded corners) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Trophy icon - scaled down for safe zone (80% = 410px centered) -->
  <g transform="translate(156, 120) scale(0.78)" fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trophy cup -->
    <path d="M32 32h192v96c0 53-43 96-96 96s-96-43-96-96V32z"/>
    <!-- Left handle -->
    <path d="M32 64H16a32 32 0 0 0 0 64h16"/>
    <!-- Right handle -->
    <path d="M224 64h16a32 32 0 0 1 0 64h-16"/>
    <!-- Base -->
    <path d="M80 224h96"/>
    <path d="M128 224v64"/>
    <path d="M64 288h128"/>
    <!-- Star in trophy -->
    <path d="M128 80l12 24 26 4-19 18 4 26-23-12-23 12 4-26-19-18 26-4z" fill="url(#accent)" stroke="none"/>
  </g>
  <!-- BL text - positioned in safe zone -->
  <text x="256" y="400" font-family="Arial Black, sans-serif" font-size="56" font-weight="900" fill="#00ff88" text-anchor="middle">BL</text>
</svg>