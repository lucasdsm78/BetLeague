name: Backend FastAPI CI/CD

on:
  push:
    tags:
      - "backend/v*"

concurrency:
  group: backend-fastapi-ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/betleague-back

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.11.13 flake8==7.1.1 bandit==1.8.3

      - name: Run backend lint with Ruff
        run: python -m ruff check . --select E9,F63,F7,F82

      - name: Run backend lint with Flake8
        run: python -m flake8 .

      - name: Run backend security lint with Bandit
        run: python -m bandit -q -c bandit.yaml -r application infrastructure presentation dependency_injections.py main.py outbox_worker_main.py jetstream_consumer_main.py -ll -ii

  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betleague_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d betleague_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: back
    env:
      ENVIRONMENT: test
      JSON_LOGS: "false"
      QUEUE_LOGGING_ENABLED: "false"
      LOG_SERVICE_NAME: betleague-back-ci
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/betleague_test
      REDIS_URL: redis://127.0.0.1:6379/0
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_MINUTES: "43200"
      SECRET_KEY_TOKEN: ${{ secrets.BACKEND_CI_SECRET_KEY_TOKEN }}
      SECRET_KEY_TOKEN_REFRESH: ${{ secrets.BACKEND_CI_SECRET_KEY_TOKEN_REFRESH }}
      PRIVATE_KEY: ${{ secrets.BACKEND_CI_PRIVATE_KEY }}
      PUBLIC_KEY: ${{ secrets.BACKEND_CI_PUBLIC_KEY }}
      ENCRYPTION_KEY: ${{ secrets.BACKEND_CI_ENCRYPTION_KEY }}
      API_FOOTBALL_DATA_TOKEN: ${{ secrets.BACKEND_CI_API_FOOTBALL_DATA_TOKEN }}
      URL_API_FOOTBALL_DATA: https://example.test/api-football
      STRIPE_API_KEY: ${{ secrets.BACKEND_CI_STRIPE_API_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.BACKEND_CI_STRIPE_WEBHOOK_SECRET }}
      THE_ODDS_API_API_KEY: ${{ secrets.BACKEND_CI_THE_ODDS_API_API_KEY }}
      APP_FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      TRUSTED_HOSTS: localhost,127.0.0.1
      TRUSTED_PROXY_IPS: ""
      AUTH_REDIS_FAIL_CLOSED: "true"
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      SHOP_ENABLED: "false"
      BTL_PURCHASE_ENABLED: "false"
      TOURNAMENT_SUBSCRIPTION_ENABLED: "false"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      PASSWORD_RESET_LOG_NOTIFIER_ENABLED: "false"
      API_SPORTS_KEY: ""
      API_SPORTS_FOOTBALL_URL: https://example.test/api-sports-football
      API_SPORTS_BASKETBALL_URL: https://example.test/api-sports-basketball
      API_SPORTS_RUGBY_URL: https://example.test/api-sports-rugby
      API_SPORTS_HOCKEY_URL: https://example.test/api-sports-hockey
      API_SPORTS_BASEBALL_URL: https://example.test/api-sports-baseball
      VAPID_PRIVATE_KEY: ${{ secrets.BACKEND_CI_VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.BACKEND_CI_VAPID_PUBLIC_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: back/requirements.txt

      - name: Install backend dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run backend test suite
        run: python -m pytest -q

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-tests
    permissions:
      contents: read
    environment:
      name: backend-release
    steps:
      - name: Confirm backend release gate
        run: echo "Backend release gate approved"

  publish-ghcr:
    name: Publish backend image to GHCR
    runs-on: ubuntu-latest
    needs: release-gate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: image_meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#backend/v}"
          minor="${version%.*}"

          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${version}"
            if [ "${minor}" != "${version}" ]; then
              echo "${IMAGE_NAME}:${minor}"
            fi
            echo "${IMAGE_NAME}:sha-${GITHUB_SHA}"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.title=betleague-back"
            echo "org.opencontainers.image.description=BetLeague FastAPI backend"
            echo "org.opencontainers.image.vendor=BetLeague"
            echo "org.opencontainers.image.version=${version}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./back
          file: ./back/Dockerfile
          push: true
          secrets: |
            pip_config=${{ secrets.BACKEND_BUILD_PIP_CONFIG }}
          tags: ${{ steps.image_meta.outputs.tags }}
          labels: ${{ steps.image_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max








