name: Backend FastAPI CI/CD

on:
  push:
    tags:
      - "v*"

concurrency:
  group: backend-fastapi-ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/betleague-back

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betleague_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d betleague_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: back
    env:
      ENVIRONMENT: test
      JSON_LOGS: "false"
      QUEUE_LOGGING_ENABLED: "false"
      LOG_SERVICE_NAME: betleague-back-ci
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/betleague_test
      REDIS_URL: redis://127.0.0.1:6379/0
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_MINUTES: "43200"
      SECRET_KEY_TOKEN: ${{ secrets.BACKEND_CI_SECRET_KEY_TOKEN }}
      SECRET_KEY_TOKEN_REFRESH: ${{ secrets.BACKEND_CI_SECRET_KEY_TOKEN_REFRESH }}
      PRIVATE_KEY: ${{ secrets.BACKEND_CI_PRIVATE_KEY }}
      PUBLIC_KEY: ${{ secrets.BACKEND_CI_PUBLIC_KEY }}
      ENCRYPTION_KEY: ${{ secrets.BACKEND_CI_ENCRYPTION_KEY }}
      API_FOOTBALL_DATA_TOKEN: ${{ secrets.BACKEND_CI_API_FOOTBALL_DATA_TOKEN }}
      URL_API_FOOTBALL_DATA: https://example.test/api-football
      STRIPE_API_KEY: ${{ secrets.BACKEND_CI_STRIPE_API_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.BACKEND_CI_STRIPE_WEBHOOK_SECRET }}
      THE_ODDS_API_API_KEY: ${{ secrets.BACKEND_CI_THE_ODDS_API_API_KEY }}
      APP_FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      TRUSTED_HOSTS: localhost,127.0.0.1
      TRUSTED_PROXY_IPS: ""
      AUTH_REDIS_FAIL_CLOSED: "true"
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      SHOP_ENABLED: "false"
      BTL_PURCHASE_ENABLED: "false"
      TOURNAMENT_SUBSCRIPTION_ENABLED: "false"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      PASSWORD_RESET_LOG_NOTIFIER_ENABLED: "false"
      API_SPORTS_KEY: ""
      API_SPORTS_FOOTBALL_URL: https://example.test/api-sports-football
      API_SPORTS_BASKETBALL_URL: https://example.test/api-sports-basketball
      API_SPORTS_RUGBY_URL: https://example.test/api-sports-rugby
      API_SPORTS_HOCKEY_URL: https://example.test/api-sports-hockey
      API_SPORTS_BASEBALL_URL: https://example.test/api-sports-baseball
      VAPID_PRIVATE_KEY: ${{ secrets.BACKEND_CI_VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.BACKEND_CI_VAPID_PUBLIC_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: back/requirements.txt

      - name: Install backend dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run backend test suite
        run: python -m pytest -q

  docker-build-verify:
    name: Docker build verification
    runs-on: ubuntu-latest
    needs: backend-tests
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./back
          file: ./back/Dockerfile
          push: false
          load: false
          secrets: |
            pip_config=${{ secrets.BACKEND_BUILD_PIP_CONFIG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-ghcr:
    name: Publish backend image to GHCR
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - docker-build-verify
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=betleague-back
            org.opencontainers.image.description=BetLeague FastAPI backend
            org.opencontainers.image.vendor=BetLeague

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./back
          file: ./back/Dockerfile
          push: true
          secrets: |
            pip_config=${{ secrets.BACKEND_BUILD_PIP_CONFIG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max





