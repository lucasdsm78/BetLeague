name: Terraform State Backend

on:
  pull_request:
    paths:
      - "infrastructure/state-backend/**"
      - "infrastructure/state-identities/**"
      - "infrastructure/scripts/render-state-backend-tfvars.sh"
      - ".github/workflows/terraform-state-backend.yml"
      - ".github/workflows/terraform-state-identities.yml"
      - ".github/workflows/terraform-static-checks.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "infrastructure/state-backend/**"
      - "infrastructure/state-identities/**"
      - "infrastructure/scripts/render-state-backend-tfvars.sh"
      - ".github/workflows/terraform-state-backend.yml"
      - ".github/workflows/terraform-state-identities.yml"
      - ".github/workflows/terraform-static-checks.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to execute on the secured self-hosted runner"
        required: true
        type: choice
        options:
          - plan
          - apply
      confirm_apply:
        description: "Type APPLY to confirm the bucket bootstrap/apply"
        required: false
        type: string

concurrency:
  group: terraform-state-backend-${{ github.event_name == 'workflow_dispatch' && inputs.operation || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  static-checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/terraform-static-checks.yml
    with:
      working-directory: infrastructure/state-backend
      lockfile-path: infrastructure/state-backend/.terraform.lock.hcl
      requires-ssh-key: false

  secure-plan-or-apply:
    name: Secure state backend plan/apply
    if: github.event_name == 'workflow_dispatch'
    needs: static-checks
    runs-on: ${{ fromJSON(vars.BETLEAGUE_SELF_HOSTED_RUNNER_LABELS_JSON || '["self-hosted","macOS"]') }}
    timeout-minutes: 30
    environment:
      name: state-backend
    permissions:
      contents: read
    env:
      TF_STATE_IDENTITIES_LOCAL_BACKEND_PATH: ${{ vars.TF_STATE_IDENTITIES_LOCAL_BACKEND_PATH }}
      TF_STATE_BACKEND_LOCAL_BACKEND_PATH: ${{ vars.TF_STATE_BACKEND_LOCAL_BACKEND_PATH }}
    steps:
      - name: Fail fast if required variables are missing
        run: |
          set -euo pipefail
          test -n "$TF_STATE_IDENTITIES_LOCAL_BACKEND_PATH"
          test -n "$TF_STATE_BACKEND_LOCAL_BACKEND_PATH"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare Terraform plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-${{ runner.os }}-${{ hashFiles('infrastructure/state-backend/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-

      - name: Prepare persistent local backend path
        run: |
          set -euo pipefail
          install -d -m 700 "$(dirname "$TF_STATE_BACKEND_LOCAL_BACKEND_PATH")"

      - name: Render state-backend tfvars from state-identities
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/infrastructure/scripts/render-state-backend-tfvars.sh" \
            "$GITHUB_WORKSPACE/infrastructure/state-identities" \
            "$GITHUB_WORKSPACE/infrastructure/state-backend/terraform.ci.auto.tfvars"

      - name: Terraform init with secured local backend path
        working-directory: infrastructure/state-backend
        run: terraform init -reconfigure -backend-config="path=$TF_STATE_BACKEND_LOCAL_BACKEND_PATH"

      - name: Terraform plan
        working-directory: infrastructure/state-backend
        run: terraform plan -no-color -out=tfplan

      - name: Publish redacted plan summary
        working-directory: infrastructure/state-backend
        run: |
          terraform show -json tfplan > tfplan.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path('tfplan.json').read_text())
          changes = []
          for change in plan.get('resource_changes', []):
              actions = change.get('change', {}).get('actions', [])
              changes.append((change.get('address', 'unknown'), ','.join(actions) or 'no-op'))

          counts = {'create': 0, 'update': 0, 'delete': 0, 'replace': 0}
          for _, actions in changes:
              parts = actions.split(',')
              if parts == ['create']:
                  counts['create'] += 1
              elif parts == ['update']:
                  counts['update'] += 1
              elif parts == ['delete']:
                  counts['delete'] += 1
              elif parts == ['delete', 'create'] or parts == ['create', 'delete']:
                  counts['replace'] += 1

          lines = [
              '## Terraform state-backend plan',
              '',
              f"- create: {counts['create']}",
              f"- update: {counts['update']}",
              f"- delete: {counts['delete']}",
              f"- replace: {counts['replace']}",
          ]

          if changes:
              lines.extend(['', '### Resource changes', ''])
              for address, actions in changes:
                  lines.append(f'- `{address}` → `{actions}`')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY

      - name: Terraform apply reviewed plan
        if: inputs.operation == 'apply'
        working-directory: infrastructure/state-backend
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm_apply }}" != "APPLY" ]]; then
            echo "confirm_apply must be exactly APPLY" >&2
            exit 1
          fi
          terraform apply -auto-approve tfplan

      - name: Post-apply guidance
        if: inputs.operation == 'apply'
        run: |
          {
            echo ''
            echo '### Next step after apply'
            echo ''
            echo 'The remote state buckets are ready. You can now use `.github/workflows/terraform-ci.yml` for the main infrastructure stack.'
            echo 'Ensure the repository secrets `OVH_S3_ACCESS_KEY_ID_DEV`, `OVH_S3_SECRET_ACCESS_KEY_DEV`, `OVH_S3_ACCESS_KEY_ID_PROD`, and `OVH_S3_SECRET_ACCESS_KEY_PROD` are configured from the `state-identities` credentials.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup ephemeral plan and tfvars files
        if: ${{ always() }}
        working-directory: infrastructure/state-backend
        run: |
          shred -u tfplan tfplan.json terraform.ci.auto.tfvars 2>/dev/null || rm -f -- tfplan tfplan.json terraform.ci.auto.tfvars


