name: Terraform CI

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-*.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-*.yml"
  workflow_dispatch:

concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform-fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infrastructure/terraform

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    needs: terraform-fmt
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
      TF_VAR_ovh_application_key: ${{ secrets.OVH_APPLICATION_KEY }}
      TF_VAR_ovh_application_secret: ${{ secrets.OVH_APPLICATION_SECRET }}
      TF_VAR_ovh_consumer_key: ${{ secrets.OVH_CONSUMER_KEY }}
      TF_VAR_service_name: ${{ vars.TF_VAR_SERVICE_NAME }}
      TF_VAR_region: ${{ vars.TF_VAR_REGION }}
      TF_VAR_flavor_id: ${{ vars.TF_VAR_FLAVOR_ID }}
      TF_VAR_image_id: ${{ vars.TF_VAR_IMAGE_ID }}
      GH_TF_VAR_PROJECT_NAME: ${{ vars.TF_VAR_PROJECT_NAME }}
      GH_TF_VAR_ENVIRONMENT: ${{ vars.TF_VAR_ENVIRONMENT }}
      GH_TF_VAR_INSTANCE_NAME: ${{ vars.TF_VAR_INSTANCE_NAME }}
      GH_TF_VAR_SSH_KEY_NAME: ${{ vars.TF_VAR_SSH_KEY_NAME }}
      GH_TF_VAR_SSH_KEY_PUBLIC_KEY: ${{ vars.TF_VAR_SSH_KEY_PUBLIC_KEY }}
      GH_TF_VAR_SSH_AUTHORIZED_KEYS: ${{ vars.TF_VAR_SSH_AUTHORIZED_KEYS }}
      GH_TF_VAR_ADMIN_USER: ${{ vars.TF_VAR_ADMIN_USER }}
      GH_TF_VAR_BILLING_PERIOD: ${{ vars.TF_VAR_BILLING_PERIOD }}
      GH_TF_VAR_PRIVATE_SUBNET_CIDR: ${{ vars.TF_VAR_PRIVATE_SUBNET_CIDR }}
      GH_TF_VAR_TIMEZONE: ${{ vars.TF_VAR_TIMEZONE }}
      GH_TF_VAR_ALLOWED_TCP_PORTS: ${{ vars.TF_VAR_ALLOWED_TCP_PORTS }}
      GH_TF_VAR_DOCKER_USERS: ${{ vars.TF_VAR_DOCKER_USERS }}
      GH_TF_VAR_EXTRA_PACKAGES: ${{ vars.TF_VAR_EXTRA_PACKAGES }}
      GH_TF_VAR_ENABLE_FAIL2BAN: ${{ vars.TF_VAR_ENABLE_FAIL2BAN }}
      GH_TF_VAR_COMPOSE_ROOT: ${{ vars.TF_VAR_COMPOSE_ROOT }}
      GH_TF_VAR_CREATE_DNS_RECORDS: ${{ vars.TF_VAR_CREATE_DNS_RECORDS }}
      GH_TF_VAR_DNS_ZONE: ${{ vars.TF_VAR_DNS_ZONE }}
      GH_TF_VAR_DNS_DEFAULT_TTL: ${{ vars.TF_VAR_DNS_DEFAULT_TTL }}
      GH_TF_VAR_APP_SUBDOMAIN: ${{ vars.TF_VAR_APP_SUBDOMAIN }}
      GH_TF_VAR_API_SUBDOMAIN: ${{ vars.TF_VAR_API_SUBDOMAIN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Prepare Terraform plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('infrastructure/terraform/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-

      - name: Load SSH key for private module sources
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TF_MODULES_SSH_PRIVATE_KEY }}

      - name: Add GitHub to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Export optional Terraform variables
        run: bash infrastructure/terraform/scripts/export_optional_tf_env.sh

      - name: Terraform init without backend
        working-directory: infrastructure/terraform
        run: terraform init -backend=false -reconfigure

      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate

  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
      TF_VAR_ovh_application_key: ${{ secrets.OVH_APPLICATION_KEY }}
      TF_VAR_ovh_application_secret: ${{ secrets.OVH_APPLICATION_SECRET }}
      TF_VAR_ovh_consumer_key: ${{ secrets.OVH_CONSUMER_KEY }}
      TF_VAR_service_name: ${{ vars.TF_VAR_SERVICE_NAME }}
      TF_VAR_region: ${{ vars.TF_VAR_REGION }}
      TF_VAR_flavor_id: ${{ vars.TF_VAR_FLAVOR_ID }}
      TF_VAR_image_id: ${{ vars.TF_VAR_IMAGE_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.OVH_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OVH_S3_SECRET_ACCESS_KEY }}
      GH_TF_VAR_PROJECT_NAME: ${{ vars.TF_VAR_PROJECT_NAME }}
      GH_TF_VAR_ENVIRONMENT: ${{ vars.TF_VAR_ENVIRONMENT }}
      GH_TF_VAR_INSTANCE_NAME: ${{ vars.TF_VAR_INSTANCE_NAME }}
      GH_TF_VAR_SSH_KEY_NAME: ${{ vars.TF_VAR_SSH_KEY_NAME }}
      GH_TF_VAR_SSH_KEY_PUBLIC_KEY: ${{ vars.TF_VAR_SSH_KEY_PUBLIC_KEY }}
      GH_TF_VAR_SSH_AUTHORIZED_KEYS: ${{ vars.TF_VAR_SSH_AUTHORIZED_KEYS }}
      GH_TF_VAR_ADMIN_USER: ${{ vars.TF_VAR_ADMIN_USER }}
      GH_TF_VAR_BILLING_PERIOD: ${{ vars.TF_VAR_BILLING_PERIOD }}
      GH_TF_VAR_PRIVATE_SUBNET_CIDR: ${{ vars.TF_VAR_PRIVATE_SUBNET_CIDR }}
      GH_TF_VAR_TIMEZONE: ${{ vars.TF_VAR_TIMEZONE }}
      GH_TF_VAR_ALLOWED_TCP_PORTS: ${{ vars.TF_VAR_ALLOWED_TCP_PORTS }}
      GH_TF_VAR_DOCKER_USERS: ${{ vars.TF_VAR_DOCKER_USERS }}
      GH_TF_VAR_EXTRA_PACKAGES: ${{ vars.TF_VAR_EXTRA_PACKAGES }}
      GH_TF_VAR_ENABLE_FAIL2BAN: ${{ vars.TF_VAR_ENABLE_FAIL2BAN }}
      GH_TF_VAR_COMPOSE_ROOT: ${{ vars.TF_VAR_COMPOSE_ROOT }}
      GH_TF_VAR_CREATE_DNS_RECORDS: ${{ vars.TF_VAR_CREATE_DNS_RECORDS }}
      GH_TF_VAR_DNS_ZONE: ${{ vars.TF_VAR_DNS_ZONE }}
      GH_TF_VAR_DNS_DEFAULT_TTL: ${{ vars.TF_VAR_DNS_DEFAULT_TTL }}
      GH_TF_VAR_APP_SUBDOMAIN: ${{ vars.TF_VAR_APP_SUBDOMAIN }}
      GH_TF_VAR_API_SUBDOMAIN: ${{ vars.TF_VAR_API_SUBDOMAIN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Prepare Terraform plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('infrastructure/terraform/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-

      - name: Load SSH key for private module sources
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TF_MODULES_SSH_PRIVATE_KEY }}

      - name: Add GitHub to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Export optional Terraform variables
        run: bash infrastructure/terraform/scripts/export_optional_tf_env.sh

      - name: Render backend configuration
        working-directory: infrastructure/terraform
        run: cp backend.hcl.example backend.hcl

      - name: Terraform init with backend
        working-directory: infrastructure/terraform
        run: terraform init -reconfigure -backend-config=backend.hcl

      - name: Terraform plan
        working-directory: infrastructure/terraform
        run: terraform plan -no-color -out=tfplan

      - name: Export plan to text
        working-directory: infrastructure/terraform
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Publish plan summary
        working-directory: infrastructure/terraform
        run: |
          {
            echo '## Terraform plan'
            echo ''
            echo '```text'
            cat tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: |
            infrastructure/terraform/tfplan
            infrastructure/terraform/tfplan.txt
          retention-days: 7

