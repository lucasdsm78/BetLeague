name: Terraform OVH Infrastructure

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-*.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-*.yml"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm_apply:
        description: "Type APPLY to confirm the deployment"
        required: true
        type: string

concurrency:
  group: terraform-ovh-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache

jobs:
  static-checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/terraform-static-checks.yml
    secrets: inherit
    with:
      working-directory: infrastructure/terraform

  plan:
    name: Terraform plan
    if: github.event_name == 'workflow_dispatch'
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.target_environment == 'prod' && 'production' || 'development' }}
    env:
      TF_VAR_ovh_application_key: ${{ secrets.OVH_APPLICATION_KEY }}
      TF_VAR_ovh_application_secret: ${{ secrets.OVH_APPLICATION_SECRET }}
      TF_VAR_ovh_consumer_key: ${{ secrets.OVH_CONSUMER_KEY }}
      TF_VAR_project_name: ${{ vars.TF_VAR_PROJECT_NAME }}
      TF_VAR_environment: ${{ inputs.target_environment }}
      TF_VAR_vps_name: ${{ inputs.target_environment == 'prod' && vars.TF_VAR_VPS_NAME_PROD || vars.TF_VAR_VPS_NAME_DEV }}
      TF_VAR_vps_display_name: ${{ inputs.target_environment == 'prod' && vars.TF_VAR_VPS_DISPLAY_NAME_PROD || vars.TF_VAR_VPS_DISPLAY_NAME_DEV }}
      TF_VAR_ovh_subsidiary: ${{ vars.TF_VAR_OVH_SUBSIDIARY }}
      TF_VAR_vps_zone: ${{ inputs.target_environment == 'prod' && vars.TF_VAR_VPS_ZONE_PROD || vars.TF_VAR_VPS_ZONE_DEV }}
      TF_VAR_vps_offer_type: ${{ vars.TF_VAR_VPS_OFFER_TYPE }}
      TF_VAR_vps_plan_code: ${{ inputs.target_environment == 'prod' && vars.TF_VAR_VPS_PLAN_CODE_PROD || vars.TF_VAR_VPS_PLAN_CODE_DEV }}
      TF_VAR_vps_pricing_mode: ${{ vars.TF_VAR_VPS_PRICING_MODE }}
      TF_VAR_vps_duration: ${{ vars.TF_VAR_VPS_DURATION }}
      TF_VAR_vps_image_id: ${{ inputs.target_environment == 'prod' && vars.TF_VAR_VPS_IMAGE_ID_PROD || vars.TF_VAR_VPS_IMAGE_ID_DEV }}
      TF_VAR_vps_public_ssh_key: ${{ inputs.target_environment == 'prod' && vars.TF_VAR_VPS_PUBLIC_SSH_KEY_PROD || vars.TF_VAR_VPS_PUBLIC_SSH_KEY_DEV }}
      TF_VAR_admin_user: ${{ vars.TF_VAR_ADMIN_USER }}
      TF_VAR_compose_root: ${{ vars.TF_VAR_COMPOSE_ROOT }}
      TF_VAR_create_dns_records: ${{ vars.TF_VAR_CREATE_DNS_RECORDS }}
      TF_VAR_dns_zone: ${{ inputs.target_environment == 'prod' && vars.TF_VAR_DNS_ZONE_PROD || vars.TF_VAR_DNS_ZONE_DEV }}
      TF_VAR_dns_default_ttl: ${{ vars.TF_VAR_DNS_DEFAULT_TTL }}
      TF_VAR_app_subdomain: ${{ inputs.target_environment == 'prod' && vars.TF_VAR_APP_SUBDOMAIN_PROD || vars.TF_VAR_APP_SUBDOMAIN_DEV }}
      TF_VAR_api_subdomain: ${{ inputs.target_environment == 'prod' && vars.TF_VAR_API_SUBDOMAIN_PROD || vars.TF_VAR_API_SUBDOMAIN_DEV }}
      AWS_ACCESS_KEY_ID: ${{ inputs.target_environment == 'prod' && secrets.OVH_S3_ACCESS_KEY_ID_PROD || secrets.OVH_S3_ACCESS_KEY_ID_DEV }}
      AWS_SECRET_ACCESS_KEY: ${{ inputs.target_environment == 'prod' && secrets.OVH_S3_SECRET_ACCESS_KEY_PROD || secrets.OVH_S3_SECRET_ACCESS_KEY_DEV }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Prepare Terraform plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('infrastructure/terraform/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-

      - name: Load SSH key for private module sources
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TF_MODULES_SSH_PRIVATE_KEY }}

      - name: Add GitHub to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Render environment backend configuration
        working-directory: infrastructure/terraform
        run: cp "environments/${{ inputs.target_environment }}/backend.hcl.example" backend.hcl

      - name: Terraform init with backend
        working-directory: infrastructure/terraform
        run: terraform init -reconfigure -backend-config=backend.hcl

      - name: Terraform plan
        working-directory: infrastructure/terraform
        run: terraform plan -no-color -out=tfplan

      - name: Export plan to text
        working-directory: infrastructure/terraform
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Publish plan summary
        working-directory: infrastructure/terraform
        run: |
          {
            echo '## Terraform plan'
            echo ''
            echo '```text'
            cat tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}-${{ inputs.target_environment }}
          path: |
            infrastructure/terraform/tfplan
            infrastructure/terraform/tfplan.txt
          retention-days: 7

  apply-dev:
    name: Terraform apply dev
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_apply == 'APPLY' && inputs.target_environment == 'dev'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
    env:
      TF_VAR_ovh_application_key: ${{ secrets.OVH_APPLICATION_KEY }}
      TF_VAR_ovh_application_secret: ${{ secrets.OVH_APPLICATION_SECRET }}
      TF_VAR_ovh_consumer_key: ${{ secrets.OVH_CONSUMER_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.OVH_S3_ACCESS_KEY_ID_DEV }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OVH_S3_SECRET_ACCESS_KEY_DEV }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Prepare Terraform plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('infrastructure/terraform/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-

      - name: Load SSH key for private module sources
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TF_MODULES_SSH_PRIVATE_KEY }}

      - name: Add GitHub to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Render environment backend configuration
        working-directory: infrastructure/terraform
        run: cp environments/dev/backend.hcl.example backend.hcl

      - name: Terraform init with backend
        working-directory: infrastructure/terraform
        run: terraform init -reconfigure -backend-config=backend.hcl

      - name: Download reviewed plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}-dev
          path: infrastructure/terraform

      - name: Terraform apply reviewed plan
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: Export outputs
        working-directory: infrastructure/terraform
        run: terraform output -json > terraform-outputs.json

      - name: Upload apply artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-${{ github.run_id }}-dev
          path: infrastructure/terraform/terraform-outputs.json
          retention-days: 7

  apply-prod:
    name: Terraform apply prod
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_apply == 'APPLY' && inputs.target_environment == 'prod'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      TF_VAR_ovh_application_key: ${{ secrets.OVH_APPLICATION_KEY }}
      TF_VAR_ovh_application_secret: ${{ secrets.OVH_APPLICATION_SECRET }}
      TF_VAR_ovh_consumer_key: ${{ secrets.OVH_CONSUMER_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.OVH_S3_ACCESS_KEY_ID_PROD }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OVH_S3_SECRET_ACCESS_KEY_PROD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Prepare Terraform plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('infrastructure/terraform/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-

      - name: Load SSH key for private module sources
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TF_MODULES_SSH_PRIVATE_KEY }}

      - name: Add GitHub to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Render environment backend configuration
        working-directory: infrastructure/terraform
        run: cp environments/prod/backend.hcl.example backend.hcl

      - name: Terraform init with backend
        working-directory: infrastructure/terraform
        run: terraform init -reconfigure -backend-config=backend.hcl

      - name: Download reviewed plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}-prod
          path: infrastructure/terraform

      - name: Terraform apply reviewed plan
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: Export outputs
        working-directory: infrastructure/terraform
        run: terraform output -json > terraform-outputs.json

      - name: Upload apply artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-${{ github.run_id }}-prod
          path: infrastructure/terraform/terraform-outputs.json
          retention-days: 7

  harden-host-prod:
    name: Harden host prod
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_apply == 'APPLY' && inputs.target_environment == 'prod'
    needs: apply-prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: python -m pip install --upgrade pip "ansible-core>=2.18,<2.19"

      - name: Install Ansible collections
        working-directory: infrastructure/ansible
        run: ansible-galaxy collection install -r requirements.yml -p collections

      - name: Download Terraform outputs artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-apply-${{ github.run_id }}-prod
          path: ${{ runner.temp }}/terraform-outputs

      - name: Render Ansible inventory from Terraform outputs
        run: |
          python3 infrastructure/scripts/render-ansible-inventory.py \
            --input-json "$RUNNER_TEMP/terraform-outputs/terraform-outputs.json" \
            --output "$RUNNER_TEMP/hosts.yml"

      - name: Prepare SSH materials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Build Ansible connection vars file
        env:
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          payload = {"ansible_port": int(os.environ.get("SSH_PORT") or "22")}
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ansible-connection-vars.json"
          output.write_text(json.dumps(payload))
          output.chmod(0o600)
          print(output)
          PY

      - name: Build hardening vars file
        env:
          SSH_TRUSTED_CIDRS: ${{ vars.SSH_TRUSTED_CIDRS }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          raw = os.environ.get("SSH_TRUSTED_CIDRS", "")
          cidrs = [item.strip() for item in raw.replace(",", "\n").splitlines() if item.strip()]
          if not cidrs:
              raise SystemExit("SSH_TRUSTED_CIDRS must contain at least one trusted CIDR for harden_host.yml")

          payload = {
              "betleague_ssh_trusted_cidrs": cidrs,
              "betleague_public_tcp_ports": [80, 443],
          }
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "hardening-vars.json"
          output.write_text(json.dumps(payload))
          output.chmod(0o600)
          print(output)
          PY

      - name: Ansible syntax check for host hardening playbook
        run: |
          ANSIBLE_CONFIG="$GITHUB_WORKSPACE/infrastructure/ansible/ansible.cfg" \
          ansible-playbook \
            --private-key "$RUNNER_TEMP/ssh/id_ed25519" \
            -i "$RUNNER_TEMP/hosts.yml" \
            -e @"$RUNNER_TEMP/ansible-connection-vars.json" \
            -e @"$RUNNER_TEMP/hardening-vars.json" \
            infrastructure/ansible/playbooks/harden_host.yml \
            --syntax-check

      - name: Harden host with Ansible
        run: |
          ANSIBLE_CONFIG="$GITHUB_WORKSPACE/infrastructure/ansible/ansible.cfg" \
          ANSIBLE_HOST_KEY_CHECKING=True \
          ansible-playbook \
            --private-key "$RUNNER_TEMP/ssh/id_ed25519" \
            -i "$RUNNER_TEMP/hosts.yml" \
            -e @"$RUNNER_TEMP/ansible-connection-vars.json" \
            -e @"$RUNNER_TEMP/hardening-vars.json" \
            infrastructure/ansible/playbooks/harden_host.yml

  harden-host-dev:
    name: Harden host dev
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_apply == 'APPLY' && inputs.target_environment == 'dev'
    needs: apply-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: python -m pip install --upgrade pip "ansible-core>=2.18,<2.19"

      - name: Install Ansible collections
        working-directory: infrastructure/ansible
        run: ansible-galaxy collection install -r requirements.yml -p collections

      - name: Download Terraform outputs artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-apply-${{ github.run_id }}-dev
          path: ${{ runner.temp }}/terraform-outputs

      - name: Render Ansible inventory from Terraform outputs
        run: |
          python3 infrastructure/scripts/render-ansible-inventory.py \
            --input-json "$RUNNER_TEMP/terraform-outputs/terraform-outputs.json" \
            --output "$RUNNER_TEMP/hosts.yml"

      - name: Prepare SSH materials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Build Ansible connection vars file
        env:
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          payload = {"ansible_port": int(os.environ.get("SSH_PORT") or "22")}
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ansible-connection-vars.json"
          output.write_text(json.dumps(payload))
          output.chmod(0o600)
          print(output)
          PY

      - name: Build hardening vars file
        env:
          SSH_TRUSTED_CIDRS: ${{ vars.SSH_TRUSTED_CIDRS }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          raw = os.environ.get("SSH_TRUSTED_CIDRS", "")
          cidrs = [item.strip() for item in raw.replace(",", "\n").splitlines() if item.strip()]
          if not cidrs:
              raise SystemExit("SSH_TRUSTED_CIDRS must contain at least one trusted CIDR for harden_host.yml")

          payload = {
              "betleague_ssh_trusted_cidrs": cidrs,
              "betleague_public_tcp_ports": [80, 443],
          }
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "hardening-vars.json"
          output.write_text(json.dumps(payload))
          output.chmod(0o600)
          print(output)
          PY

      - name: Ansible syntax check for host hardening playbook
        run: |
          ANSIBLE_CONFIG="$GITHUB_WORKSPACE/infrastructure/ansible/ansible.cfg" \
          ansible-playbook \
            --private-key "$RUNNER_TEMP/ssh/id_ed25519" \
            -i "$RUNNER_TEMP/hosts.yml" \
            -e @"$RUNNER_TEMP/ansible-connection-vars.json" \
            -e @"$RUNNER_TEMP/hardening-vars.json" \
            infrastructure/ansible/playbooks/harden_host.yml \
            --syntax-check

      - name: Harden host with Ansible
        run: |
          ANSIBLE_CONFIG="$GITHUB_WORKSPACE/infrastructure/ansible/ansible.cfg" \
          ANSIBLE_HOST_KEY_CHECKING=True \
          ansible-playbook \
            --private-key "$RUNNER_TEMP/ssh/id_ed25519" \
            -i "$RUNNER_TEMP/hosts.yml" \
            -e @"$RUNNER_TEMP/ansible-connection-vars.json" \
            -e @"$RUNNER_TEMP/hardening-vars.json" \
            infrastructure/ansible/playbooks/harden_host.yml

  deploy-swarm-dev:
    name: Deploy Swarm dev
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_apply == 'APPLY' && inputs.target_environment == 'dev'
    needs: harden-host-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: python -m pip install --upgrade pip "ansible-core>=2.18,<2.19"

      - name: Install Ansible collections
        working-directory: infrastructure/ansible
        run: ansible-galaxy collection install -r requirements.yml -p collections

      - name: Download Terraform outputs artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-apply-${{ github.run_id }}-dev
          path: ${{ runner.temp }}/terraform-outputs

      - name: Render Ansible inventory from Terraform outputs
        run: |
          python3 infrastructure/scripts/render-ansible-inventory.py \
            --input-json "$RUNNER_TEMP/terraform-outputs/terraform-outputs.json" \
            --output "$RUNNER_TEMP/hosts.yml"

      - name: Prepare SSH materials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Build Ansible connection vars file
        env:
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          payload = {"ansible_port": int(os.environ.get("SSH_PORT") or "22")}
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ansible-connection-vars.json"
          output.write_text(json.dumps(payload))
          output.chmod(0o600)
          print(output)
          PY

      - name: Build Swarm deployment vars file
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          API_HEALTHCHECK_URL: ${{ vars.API_HEALTHCHECK_URL }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          BETLEAGUE_BACKEND_IMAGE: ${{ vars.BETLEAGUE_BACKEND_IMAGE }}
          BETLEAGUE_FRONTEND_IMAGE: ${{ vars.BETLEAGUE_FRONTEND_IMAGE }}
          GUNICORN_WORKERS: ${{ vars.GUNICORN_WORKERS }}
          GUNICORN_FORWARDED_ALLOW_IPS: ${{ vars.GUNICORN_FORWARDED_ALLOW_IPS }}
          REGISTRY_SERVER: ${{ vars.REGISTRY_SERVER }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          NATS_USER: ${{ secrets.NATS_USER }}
          NATS_PASSWORD: ${{ secrets.NATS_PASSWORD }}
          EDGE_TLS_CERT: ${{ secrets.EDGE_TLS_CERT }}
          EDGE_TLS_KEY: ${{ secrets.EDGE_TLS_KEY }}
          NATS_CA_CERT: ${{ secrets.NATS_CA_CERT }}
          NATS_SERVER_CERT: ${{ secrets.NATS_SERVER_CERT }}
          NATS_SERVER_KEY: ${{ secrets.NATS_SERVER_KEY }}
          NATS_CLIENT_CERT: ${{ secrets.NATS_CLIENT_CERT }}
          NATS_CLIENT_KEY: ${{ secrets.NATS_CLIENT_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          api_domain = os.environ["API_DOMAIN"]
          payload = {
              "betleague_swarm_stack_name": os.environ["STACK_NAME"],
              "betleague_swarm_deploy_path": os.environ.get("DEPLOY_PATH") or "/opt/betleague/swarm",
              "betleague_swarm_backend_image": os.environ["BETLEAGUE_BACKEND_IMAGE"],
              "betleague_swarm_frontend_image": os.environ["BETLEAGUE_FRONTEND_IMAGE"],
              "betleague_swarm_gunicorn_workers": int(os.environ.get("GUNICORN_WORKERS") or "2"),
              "betleague_swarm_gunicorn_forwarded_allow_ips": os.environ.get("GUNICORN_FORWARDED_ALLOW_IPS") or "*",
              "betleague_swarm_app_domain": os.environ["APP_DOMAIN"],
              "betleague_swarm_api_domain": api_domain,
              "betleague_swarm_api_healthcheck_url": os.environ.get("API_HEALTHCHECK_URL") or f"https://{api_domain}/health",
              "betleague_swarm_registry_server": os.environ.get("REGISTRY_SERVER", ""),
              "betleague_swarm_registry_username": os.environ.get("REGISTRY_USERNAME", ""),
              "betleague_swarm_registry_password": os.environ.get("REGISTRY_PASSWORD", ""),
              "betleague_swarm_backend_env_content": os.environ["BACKEND_ENV"],
              "betleague_swarm_redis_password": os.environ["REDIS_PASSWORD"],
              "betleague_swarm_nats_user": os.environ["NATS_USER"],
              "betleague_swarm_nats_password": os.environ["NATS_PASSWORD"],
              "betleague_swarm_edge_tls_cert": os.environ["EDGE_TLS_CERT"],
              "betleague_swarm_edge_tls_key": os.environ["EDGE_TLS_KEY"],
              "betleague_swarm_nats_ca_cert": os.environ["NATS_CA_CERT"],
              "betleague_swarm_nats_server_cert": os.environ["NATS_SERVER_CERT"],
              "betleague_swarm_nats_server_key": os.environ["NATS_SERVER_KEY"],
              "betleague_swarm_nats_client_cert": os.environ["NATS_CLIENT_CERT"],
              "betleague_swarm_nats_client_key": os.environ["NATS_CLIENT_KEY"],
          }
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "swarm-vars.json"
          output.write_text(json.dumps(payload))
          output.chmod(0o600)
          print(output)
          PY

      - name: Ansible syntax check for Swarm playbook
        run: |
          ANSIBLE_CONFIG="$GITHUB_WORKSPACE/infrastructure/ansible/ansible.cfg" \
          ansible-playbook \
            --private-key "$RUNNER_TEMP/ssh/id_ed25519" \
            -i "$RUNNER_TEMP/hosts.yml" \
            -e @"$RUNNER_TEMP/ansible-connection-vars.json" \
            infrastructure/ansible/playbooks/deploy_swarm.yml \
            --syntax-check

      - name: Deploy Swarm stack with Ansible
        run: |
          ANSIBLE_CONFIG="$GITHUB_WORKSPACE/infrastructure/ansible/ansible.cfg" \
          ANSIBLE_HOST_KEY_CHECKING=True \
          ansible-playbook \
            --private-key "$RUNNER_TEMP/ssh/id_ed25519" \
            -i "$RUNNER_TEMP/hosts.yml" \
            -e @"$RUNNER_TEMP/ansible-connection-vars.json" \
            -e @"$RUNNER_TEMP/swarm-vars.json" \
            infrastructure/ansible/playbooks/deploy_swarm.yml

  deploy-swarm-prod:
    name: Deploy Swarm prod
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_apply == 'APPLY' && inputs.target_environment == 'prod'
    needs: harden-host-prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: python -m pip install --upgrade pip "ansible-core>=2.18,<2.19"

      - name: Install Ansible collections
        working-directory: infrastructure/ansible
        run: ansible-galaxy collection install -r requirements.yml -p collections

      - name: Download Terraform outputs artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-apply-${{ github.run_id }}-prod
          path: ${{ runner.temp }}/terraform-outputs

      - name: Render Ansible inventory from Terraform outputs
        run: |
          python3 infrastructure/scripts/render-ansible-inventory.py \
            --input-json "$RUNNER_TEMP/terraform-outputs/terraform-outputs.json" \
            --output "$RUNNER_TEMP/hosts.yml"

      - name: Prepare SSH materials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Build Ansible connection vars file
        env:
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          payload = {"ansible_port": int(os.environ.get("SSH_PORT") or "22")}
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ansible-connection-vars.json"
          output.write_text(json.dumps(payload))
          output.chmod(0o600)
          print(output)
          PY

      - name: Build Swarm deployment vars file
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          API_HEALTHCHECK_URL: ${{ vars.API_HEALTHCHECK_URL }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          BETLEAGUE_BACKEND_IMAGE: ${{ vars.BETLEAGUE_BACKEND_IMAGE }}
          BETLEAGUE_FRONTEND_IMAGE: ${{ vars.BETLEAGUE_FRONTEND_IMAGE }}
          GUNICORN_WORKERS: ${{ vars.GUNICORN_WORKERS }}
          GUNICORN_FORWARDED_ALLOW_IPS: ${{ vars.GUNICORN_FORWARDED_ALLOW_IPS }}
          REGISTRY_SERVER: ${{ vars.REGISTRY_SERVER }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          NATS_USER: ${{ secrets.NATS_USER }}
          NATS_PASSWORD: ${{ secrets.NATS_PASSWORD }}
          EDGE_TLS_CERT: ${{ secrets.EDGE_TLS_CERT }}
          EDGE_TLS_KEY: ${{ secrets.EDGE_TLS_KEY }}
          NATS_CA_CERT: ${{ secrets.NATS_CA_CERT }}
          NATS_SERVER_CERT: ${{ secrets.NATS_SERVER_CERT }}
          NATS_SERVER_KEY: ${{ secrets.NATS_SERVER_KEY }}
          NATS_CLIENT_CERT: ${{ secrets.NATS_CLIENT_CERT }}
          NATS_CLIENT_KEY: ${{ secrets.NATS_CLIENT_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          api_domain = os.environ["API_DOMAIN"]
          payload = {
              "betleague_swarm_stack_name": os.environ["STACK_NAME"],
              "betleague_swarm_deploy_path": os.environ.get("DEPLOY_PATH") or "/opt/betleague/swarm",
              "betleague_swarm_backend_image": os.environ["BETLEAGUE_BACKEND_IMAGE"],
              "betleague_swarm_frontend_image": os.environ["BETLEAGUE_FRONTEND_IMAGE"],
              "betleague_swarm_gunicorn_workers": int(os.environ.get("GUNICORN_WORKERS") or "2"),
              "betleague_swarm_gunicorn_forwarded_allow_ips": os.environ.get("GUNICORN_FORWARDED_ALLOW_IPS") or "*",
              "betleague_swarm_app_domain": os.environ["APP_DOMAIN"],
              "betleague_swarm_api_domain": api_domain,
              "betleague_swarm_api_healthcheck_url": os.environ.get("API_HEALTHCHECK_URL") or f"https://{api_domain}/health",
              "betleague_swarm_registry_server": os.environ.get("REGISTRY_SERVER", ""),
              "betleague_swarm_registry_username": os.environ.get("REGISTRY_USERNAME", ""),
              "betleague_swarm_registry_password": os.environ.get("REGISTRY_PASSWORD", ""),
              "betleague_swarm_backend_env_content": os.environ["BACKEND_ENV"],
              "betleague_swarm_redis_password": os.environ["REDIS_PASSWORD"],
              "betleague_swarm_nats_user": os.environ["NATS_USER"],
              "betleague_swarm_nats_password": os.environ["NATS_PASSWORD"],
              "betleague_swarm_edge_tls_cert": os.environ["EDGE_TLS_CERT"],
              "betleague_swarm_edge_tls_key": os.environ["EDGE_TLS_KEY"],
              "betleague_swarm_nats_ca_cert": os.environ["NATS_CA_CERT"],
              "betleague_swarm_nats_server_cert": os.environ["NATS_SERVER_CERT"],
              "betleague_swarm_nats_server_key": os.environ["NATS_SERVER_KEY"],
              "betleague_swarm_nats_client_cert": os.environ["NATS_CLIENT_CERT"],
              "betleague_swarm_nats_client_key": os.environ["NATS_CLIENT_KEY"],
          }
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "swarm-vars.json"
          output.write_text(json.dumps(payload))
          output.chmod(0o600)
          print(output)
          PY

      - name: Ansible syntax check for Swarm playbook
        run: |
          ANSIBLE_CONFIG="$GITHUB_WORKSPACE/infrastructure/ansible/ansible.cfg" \
          ansible-playbook \
            --private-key "$RUNNER_TEMP/ssh/id_ed25519" \
            -i "$RUNNER_TEMP/hosts.yml" \
            -e @"$RUNNER_TEMP/ansible-connection-vars.json" \
            infrastructure/ansible/playbooks/deploy_swarm.yml \
            --syntax-check

      - name: Deploy Swarm stack with Ansible
        run: |
          ANSIBLE_CONFIG="$GITHUB_WORKSPACE/infrastructure/ansible/ansible.cfg" \
          ANSIBLE_HOST_KEY_CHECKING=True \
          ansible-playbook \
            --private-key "$RUNNER_TEMP/ssh/id_ed25519" \
            -i "$RUNNER_TEMP/hosts.yml" \
            -e @"$RUNNER_TEMP/ansible-connection-vars.json" \
            -e @"$RUNNER_TEMP/swarm-vars.json" \
            infrastructure/ansible/playbooks/deploy_swarm.yml



