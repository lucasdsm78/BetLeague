              ),
          }
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ansible-connection-vars.json"
          output.write_text(json.dumps(payload))
          output.chmod(0o600)
          print(output)
          PY

      - name: Build hardening vars file
        env:
          SSH_TRUSTED_CIDRS: ${{ vars.SSH_TRUSTED_CIDRS }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          raw = os.environ.get("SSH_TRUSTED_CIDRS", "")
          cidrs = [item.strip() for item in raw.replace(",", "\n").splitlines() if item.strip()]
          if not cidrs:
              raise SystemExit("SSH_TRUSTED_CIDRS must contain at least one trusted CIDR for harden_host.yml")

          payload = {
              "betleague_ssh_trusted_cidrs": cidrs,
              "betleague_public_tcp_ports": [80, 443],
          }
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "hardening-vars.json"
          output.write_text(json.dumps(payload))
          output.chmod(0o600)
          print(output)
          PY

      - name: Ansible syntax check for host hardening playbook
        run: |
          ANSIBLE_CONFIG="$GITHUB_WORKSPACE/infrastructure/ansible/ansible.cfg" \
          ansible-playbook \
            --private-key "$RUNNER_TEMP/ssh/id_ed25519" \
            -i "$RUNNER_TEMP/hosts.yml" \
            -e @"$RUNNER_TEMP/ansible-connection-vars.json" \
            -e @"$RUNNER_TEMP/hardening-vars.json" \
            infrastructure/ansible/playbooks/harden_host.yml \
            --syntax-check

      - name: Harden host with Ansible
        run: |
          ANSIBLE_CONFIG="$GITHUB_WORKSPACE/infrastructure/ansible/ansible.cfg" \
          ANSIBLE_HOST_KEY_CHECKING=True \
          ansible-playbook \
            --private-key "$RUNNER_TEMP/ssh/id_ed25519" \
            -i "$RUNNER_TEMP/hosts.yml" \
            -e @"$RUNNER_TEMP/ansible-connection-vars.json" \
            -e @"$RUNNER_TEMP/hardening-vars.json" \
            infrastructure/ansible/playbooks/harden_host.yml

  deploy-swarm-dev:
    name: Deploy Swarm dev
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_apply == 'APPLY' && inputs.target_environment == 'dev'
    needs: harden-host-dev
    uses: ./.github/workflows/_swarm-deploy.yml
    with:
      target_environment: dev
      inventory_strategy: terraform_artifact
      terraform_outputs_artifact: terraform-apply-${{ github.run_id }}-dev
    secrets: inherit

  deploy-swarm-prod:
    name: Deploy Swarm prod
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_apply == 'APPLY' && inputs.target_environment == 'prod'
    needs: harden-host-prod
    uses: ./.github/workflows/_swarm-deploy.yml
    with:
      target_environment: prod
      inventory_strategy: terraform_artifact
      terraform_outputs_artifact: terraform-apply-${{ github.run_id }}-prod
    secrets: inherit



