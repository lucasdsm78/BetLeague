version: "3.9"

x-service-defaults: &service-defaults
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777,noexec,nosuid
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-deploy-defaults: &deploy-defaults
  placement:
    constraints:
      - node.role == manager
      - node.labels.betleague.role == manager
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
    window: 60s
  update_config:
    parallelism: 1
    delay: 10s
    failure_action: rollback
    monitor: 30s
    order: start-first
  rollback_config:
    parallelism: 1
    delay: 5s
    order: stop-first

services:
  edge:
    <<: *service-defaults
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - target: 8080
        published: 80
        protocol: tcp
        mode: host
      - target: 8443
        published: 443
        protocol: tcp
        mode: host
    configs:
      - source: edge_nginx_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0444
    secrets:
      - source: edge_tls_cert
        target: edge_tls_cert.pem
      - source: edge_tls_key
        target: edge_tls_key.pem
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      <<: *deploy-defaults
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M

  frontend:
    <<: *service-defaults
    image: ${BETLEAGUE_FRONTEND_IMAGE:?BETLEAGUE_FRONTEND_IMAGE is required}
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      <<: *deploy-defaults
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    command:
      - sh
      - -ec
      - |
        export REDIS_PASSWORD="$(cat /run/secrets/redis_password)"
        esc_pw=$(printf '%s' "$REDIS_PASSWORD" | sed -e 's/[\\/&]/\\\\&/g')
        sed "s/__REDIS_PASSWORD__/${esc_pw}/g" /etc/redis/redis.conf.template > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    secrets:
      - source: redis_password
        target: redis_password
    configs:
      - source: redis_conf_template
        target: /etc/redis/redis.conf.template
        mode: 0444
    volumes:
      - redis_data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 6379 --user notif --pass \"$(cat /run/secrets/redis_password)\" --raw ping | grep -x PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      <<: *deploy-defaults
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        order: stop-first
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          memory: 96M

  nats:
    <<: *service-defaults
    image: nats:2.10-alpine
    command:
      - sh
      - -ec
      - |
        exec nats-server \
          -c /etc/nats/nats-server.conf \
          --user "$(cat /run/secrets/nats_user)" \
          --pass "$(cat /run/secrets/nats_password)"
    secrets:
      - source: nats_user
        target: nats_user
      - source: nats_password
        target: nats_password
      - source: nats_ca_cert
        target: ca-cert.pem
      - source: nats_server_cert
        target: server-cert.pem
      - source: nats_server_key
        target: server-key.pem
    configs:
      - source: nats_server_conf
        target: /etc/nats/nats-server.conf
        mode: 0444
    volumes:
      - nats_data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      <<: *deploy-defaults
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        order: stop-first
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 128M

  jetstream_provision:
    <<: *service-defaults
    image: ${BETLEAGUE_BACKEND_IMAGE:?BETLEAGUE_BACKEND_IMAGE is required}
    command:
      - sh
      - -ec
      - |
        set -a
        . /run/secrets/backend_env
        set +a
        exec python scripts/provision_jetstream_streams.py
    secrets:
      - source: backend_env
        target: backend_env
      - source: nats_ca_cert
        target: ca-cert.pem
      - source: nats_client_cert
        target: client-cert.pem
      - source: nats_client_key
        target: client-key.pem
    networks:
      - app
    deploy:
      placement:
        constraints:
          - node.role == manager
          - node.labels.betleague.role == manager
      replicas: 1
      restart_policy:
        condition: none
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
        reservations:
          memory: 64M

  backend:
    <<: *service-defaults
    image: ${BETLEAGUE_BACKEND_IMAGE:?BETLEAGUE_BACKEND_IMAGE is required}
    command:
      - sh
      - -ec
      - |
        set -a
        . /run/secrets/backend_env
        set +a
        export UVICORN_WORKERS="${UVICORN_WORKERS:-2}"
        ./scripts/run_migrations.sh
        exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers "$UVICORN_WORKERS"
    secrets:
      - source: backend_env
        target: backend_env
      - source: nats_ca_cert
        target: ca-cert.pem
      - source: nats_client_cert
        target: client-cert.pem
      - source: nats_client_key
        target: client-key.pem
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      <<: *deploy-defaults
      replicas: 1
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        monitor: 45s
        order: stop-first
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          memory: 256M

  celery_worker:
    <<: *service-defaults
    image: ${BETLEAGUE_BACKEND_IMAGE:?BETLEAGUE_BACKEND_IMAGE is required}
    command:
      - sh
      - -ec
      - |
        set -a
        . /run/secrets/backend_env
        set +a
        exec celery -A infrastructure.celery.celery_app worker --loglevel=info --concurrency=2
    secrets:
      - source: backend_env
        target: backend_env
    networks:
      - app
    deploy:
      <<: *deploy-defaults
      replicas: 1
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          memory: 192M

  celery_beat:
    <<: *service-defaults
    image: ${BETLEAGUE_BACKEND_IMAGE:?BETLEAGUE_BACKEND_IMAGE is required}
    command:
      - sh
      - -ec
      - |
        set -a
        . /run/secrets/backend_env
        set +a
        exec celery -A infrastructure.celery.celery_app beat --loglevel=info --schedule /var/lib/celery/celerybeat-schedule
    secrets:
      - source: backend_env
        target: backend_env
    volumes:
      - celery_beat_schedule:/var/lib/celery
    networks:
      - app
    deploy:
      <<: *deploy-defaults
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          memory: 128M

  outbox_worker:
    <<: *service-defaults
    image: ${BETLEAGUE_BACKEND_IMAGE:?BETLEAGUE_BACKEND_IMAGE is required}
    command:
      - sh
      - -ec
      - |
        set -a
        . /run/secrets/backend_env
        set +a
        exec python outbox_worker_main.py
    secrets:
      - source: backend_env
        target: backend_env
      - source: nats_ca_cert
        target: ca-cert.pem
      - source: nats_client_cert
        target: client-cert.pem
      - source: nats_client_key
        target: client-key.pem
    networks:
      - app
    deploy:
      <<: *deploy-defaults
      replicas: 1
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 160M

networks:
  edge:
    driver: overlay
    attachable: false
  app:
    driver: overlay
    attachable: false
    internal: true

volumes:
  redis_data:
  nats_data:
  celery_beat_schedule:

configs:
  edge_nginx_conf:
    file: ./generated/edge.conf
  redis_conf_template:
    file: ../../redis/redis.conf.template
  nats_server_conf:
    file: ../../back/nats/nats-server.conf

secrets:
  backend_env:
    file: ./secrets/backend.env
  redis_password:
    file: ./secrets/redis_password.txt
  nats_user:
    file: ./secrets/nats_user.txt
  nats_password:
    file: ./secrets/nats_password.txt
  edge_tls_cert:
    file: ./secrets/tls.crt.pem
  edge_tls_key:
    file: ./secrets/tls.key.pem
  nats_ca_cert:
    file: ./secrets/nats-ca-cert.pem
  nats_server_cert:
    file: ./secrets/nats-server-cert.pem
  nats_server_key:
    file: ./secrets/nats-server-key.pem
  nats_client_cert:
    file: ./secrets/nats-client-cert.pem
  nats_client_key:
    file: ./secrets/nats-client-key.pem

