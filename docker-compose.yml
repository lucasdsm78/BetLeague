version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: my_shared_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: betleague
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: fastapi_app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./:/app
    ports:
      - "8001:8001"
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:postgres@db:5432/betleague
    depends_on:
      - db

  scrapper:
    build: ../ScrapperBet
    container_name: scrapper_app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../ScrapperBet:/app
    ports:
      - "8000:8000"
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:postgres@db:5432/betleague
    depends_on:
      - db

volumes:
  db_data:
