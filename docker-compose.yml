services:
  db:
    image: postgres:15-alpine
    container_name: my_shared_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: betleague
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

  nats:
    image: nats:2.10-alpine
    container_name: nats
    command:
      - "-js"
      - "--store_dir"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  redis:
    image: redis:7-alpine
    container_name: redis
    expose:
      - "6379"
    volumes:
      - ./redis/redis.conf.template:/usr/local/etc/redis/redis.conf.template:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password_change_me}
    command:
      - sh
      - -lc
      - |
        set -e
        if [ -z "${REDIS_PASSWORD}" ]; then echo "REDIS_PASSWORD is required" >&2; exit 1; fi
        # Escape '\\', '&' and '/' for sed replacement
        esc_pw=$$(printf '%s' "$$REDIS_PASSWORD" | sed -e 's/[\\/&]/\\\\&/g')
        sed "s/__REDIS_PASSWORD__/$${esc_pw}/g" /usr/local/etc/redis/redis.conf.template > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user notif --pass $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: back
      dockerfile: Dockerfile
    container_name: fastapi_app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./back:/app
    ports:
      - "8001:8001"
    env_file:
      - back/.env
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/betleague
      REDIS_URL: "redis://notif:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/0"
      NOTIFICATIONS_REALTIME_DRIVER: "redis"
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: back
      dockerfile: Dockerfile
    container_name: celery_worker
    command: celery -A infrastructure.celery.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./back:/app
    env_file:
      - back/.env
    environment:
      PYTHONPATH: /app
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/betleague
      REDIS_URL: "redis://notif:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/0"
      CELERY_BROKER_URL: "redis://celery:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://celery:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/2"
    depends_on:
      - db
      - redis
    restart: always

  celery_beat:
    build:
      context: back
      dockerfile: Dockerfile
    container_name: celery_beat
    command: celery -A infrastructure.celery.celery_app beat --loglevel=info
    volumes:
      - ./back:/app
    env_file:
      - back/.env
    environment:
      PYTHONPATH: /app
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/betleague
      REDIS_URL: "redis://notif:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/0"
      CELERY_BROKER_URL: "redis://celery:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://celery:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/2"
    depends_on:
      - redis
    restart: always

  outbox_worker:
    build:
      context: back
      dockerfile: Dockerfile
    container_name: outbox_worker
    command: python outbox_worker_main.py
    volumes:
      - ./back:/app
    env_file:
      - back/.env
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/betleague
      REDIS_URL: "redis://notif:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/0"
      NOTIFICATIONS_REALTIME_DRIVER: "redis"
      OUTBOX_DISPATCH_MODE: "jetstream"
      NATS_URL: "nats://nats:4222"
      NATS_STREAM: "BETLEAGUE"
      NATS_SUBJECT_PREFIX: "betleague"
      NATS_STREAM_SUBJECTS: "betleague.league.* , betleague.ticket.* , betleague.match.*"
      OUTBOX_BATCH_SIZE: 50
      OUTBOX_POLL_INTERVAL_MS: 250
      OUTBOX_MAX_POLL_INTERVAL_MS: 5000
      OUTBOX_JITTER_MS: 150
      OUTBOX_WORKER_ID: outbox_worker_1
      OUTBOX_LOCK_TTL_MS: 120000
    depends_on:
      - db
      - backend
      - redis
      - nats
    restart: always

  # Consumer de démo (optionnel) : affiche les événements JetStream
  jetstream_consumer:
    build:
      context: back
      dockerfile: Dockerfile
    container_name: jetstream_consumer
    command: python jetstream_consumer_main.py
    volumes:
      - ./back:/app
    env_file:
      - back/.env
    environment:
      NATS_URL: "nats://nats:4222"
      NATS_STREAM: "BETLEAGUE"
      NATS_SUBJECT_PREFIX: "betleague"
      NATS_DURABLE: "betleague_consumer"
      # Multi-subscribe explicite (le consumer ne s'abonne pas à betleague.> pour ne pas consommer la DLQ)
      NATS_CONSUMER_SUBJECTS: "betleague.league.* , betleague.ticket.* , betleague.match.*"
      # DLQ (stream séparé)
      NATS_DLQ_STREAM: "BETLEAGUE_DLQ"
      NATS_DLQ_SUBJECT_PREFIX: "betleague.dlq"
      NATS_MAX_DELIVER: 10
    depends_on:
      - nats
    restart: unless-stopped

volumes:
  db_data:
  nats_data:
