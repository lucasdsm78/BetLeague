services:
  db:
    image: postgres:15-alpine
    container_name: my_shared_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: betleague
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

  nats:
    image: nats:2.10-alpine
    container_name: nats
    command:
      - "-c"
      - "/etc/nats/nats-server.conf"
      - "--user"
      - "${NATS_USER:-betleague}"
      - "--pass"
      - "${NATS_PASSWORD:-betleague_dev_password}"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
      - ./back/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./back/nats/certs:/etc/nats/certs:ro

  jetstream_provision:
    build:
      context: back
      dockerfile: Dockerfile
    container_name: jetstream_provision
    command: python scripts/provision_jetstream_streams.py
    volumes:
      - ./back:/app
      - ./back/nats/certs:/etc/nats/certs:ro
    env_file:
      - back/.env
    environment:
      PYTHONPATH: /app
      NATS_URL: "${NATS_URL:-tls://nats:4222}"
      NATS_STREAM: "BETLEAGUE"
      NATS_SUBJECT_PREFIX: "betleague"
      NATS_DLQ_STREAM: "BETLEAGUE_DLQ"
      NATS_DLQ_SUBJECT_PREFIX: "betleague.dlq"
      NATS_STREAM_SUBJECTS: "betleague.league.> , betleague.ticket.> , betleague.match.>"
      NATS_USER: "${NATS_USER:-betleague}"
      NATS_PASSWORD: "${NATS_PASSWORD:-betleague_dev_password}"
      NATS_TLS_CA: "/etc/nats/certs/ca-cert.pem"
      NATS_TLS_CERT: "/etc/nats/certs/client-cert.pem"
      NATS_TLS_KEY: "/etc/nats/certs/client-key.pem"
    depends_on:
      - nats
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: redis
    expose:
      - "6379"
    volumes:
      - ./redis/redis.conf.template:/usr/local/etc/redis/redis.conf.template:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password_change_me}
    command:
      - sh
      - -lc
      - |
        set -e
        if [ -z "${REDIS_PASSWORD}" ]; then echo "REDIS_PASSWORD is required" >&2; exit 1; fi
        # Escape '\\', '&' and '/' for sed replacement
        esc_pw=$$(printf '%s' "$$REDIS_PASSWORD" | sed -e 's/[\\/&]/\\\\&/g')
        sed "s/__REDIS_PASSWORD__/$${esc_pw}/g" /usr/local/etc/redis/redis.conf.template > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 6379 --user notif --pass $$REDIS_PASSWORD --raw ping | grep -x PONG"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: back
      dockerfile: Dockerfile
    container_name: fastapi_app
    command:
      - sh
      - -lc
      - ./scripts/run_migrations.sh && uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./back:/app
    ports:
      - "8001:8001"
    env_file:
      - back/.env
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/betleague
      REDIS_URL: "redis://notif:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/0"
      NOTIFICATIONS_REALTIME_DRIVER: "redis"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: back
      dockerfile: Dockerfile
    container_name: celery_worker
    command: celery -A infrastructure.celery.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./back:/app
    env_file:
      - back/.env
    environment:
      PYTHONPATH: /app
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/betleague
      REDIS_URL: "redis://notif:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/0"
      CELERY_BROKER_URL: "redis://celery:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://celery:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/2"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always

  celery_beat:
    build:
      context: back
      dockerfile: Dockerfile
    container_name: celery_beat
    command: celery -A infrastructure.celery.celery_app beat --loglevel=info --schedule /var/lib/celery/celerybeat-schedule
    volumes:
      - ./back:/app
      - celery_beat_schedule:/var/lib/celery
    env_file:
      - back/.env
    environment:
      PYTHONPATH: /app
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/betleague
      REDIS_URL: "redis://notif:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/0"
      CELERY_BROKER_URL: "redis://celery:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://celery:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/2"
      CELERY_TIMEZONE: "Europe/Paris"
      CELERY_ENABLE_UTC: "0"
      CELERY_ENABLE_CATCHUP: "1"
      CELERY_CATCHUP_THRESHOLD_SECONDS: "900"
      CELERY_LAST_SCORE_CHECK_KEY: "betleague:celery:last_check_match_scores_at"
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  outbox_worker:
    build:
      context: back
      dockerfile: Dockerfile
    container_name: outbox_worker
    command: python outbox_worker_main.py
    volumes:
      - ./back:/app
      - ./back/nats/certs:/etc/nats/certs:ro
    env_file:
      - back/.env
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/betleague
      REDIS_URL: "redis://notif:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/0"
      NOTIFICATIONS_REALTIME_DRIVER: "redis"
      OUTBOX_DISPATCH_MODE: "jetstream"
      NATS_URL: "${NATS_URL:-tls://nats:4222}"
      NATS_STREAM: "BETLEAGUE"
      NATS_SUBJECT_PREFIX: "betleague"
      NATS_STREAM_SUBJECTS: "betleague.league.> , betleague.ticket.> , betleague.match.>"
      NATS_USER: "${NATS_USER:-betleague}"
      NATS_PASSWORD: "${NATS_PASSWORD:-betleague_dev_password}"
      NATS_TLS_CA: "/etc/nats/certs/ca-cert.pem"
      NATS_TLS_CERT: "/etc/nats/certs/client-cert.pem"
      NATS_TLS_KEY: "/etc/nats/certs/client-key.pem"
      OUTBOX_BATCH_SIZE: 50
      OUTBOX_POLL_INTERVAL_MS: 250
      OUTBOX_MAX_POLL_INTERVAL_MS: 5000
      OUTBOX_JITTER_MS: 150
      OUTBOX_WORKER_ID: outbox_worker_1
      OUTBOX_LOCK_TTL_MS: 120000
      NATS_PROVISIONED_STREAMS: "1"
    depends_on:
      db:
        condition: service_started
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      jetstream_provision:
        condition: service_completed_successfully
    restart: always

  frontend:
    build:
      context: front
      dockerfile: Dockerfile.dev
    container_name: frontend_app
    volumes:
      - ./front/src:/app/src
      - ./front/public:/app/public
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8001/api
      REACT_APP_ENV: development
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend

  # Consumer de démo (optionnel) : affiche les événements JetStream
  jetstream_consumer:
    build:
      context: back
      dockerfile: Dockerfile
    container_name: jetstream_consumer
    command: python jetstream_consumer_main.py
    volumes:
      - ./back:/app
      - ./back/nats/certs:/etc/nats/certs:ro
    env_file:
      - back/.env
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/betleague
      NATS_URL: "${NATS_URL:-tls://nats:4222}"
      NATS_STREAM: "BETLEAGUE"
      NATS_SUBJECT_PREFIX: "betleague"
      NATS_DURABLE: "betleague_consumer"
      NATS_USER: "${NATS_USER:-betleague}"
      NATS_PASSWORD: "${NATS_PASSWORD:-betleague_dev_password}"
      NATS_CONSUMER_SUBJECTS: "betleague.league.> , betleague.ticket.> , betleague.match.>"
      NATS_TLS_CA: "/etc/nats/certs/ca-cert.pem"
      NATS_TLS_CERT: "/etc/nats/certs/client-cert.pem"
      NATS_TLS_KEY: "/etc/nats/certs/client-key.pem"
      # DLQ (stream séparé)
      NATS_DLQ_STREAM: "BETLEAGUE_DLQ"
      NATS_DLQ_SUBJECT_PREFIX: "betleague.dlq"
      NATS_MAX_DELIVER: 10
      NATS_PROVISIONED_STREAMS: "1"
    depends_on:
      - nats
      - jetstream_provision
    restart: unless-stopped

volumes:
  db_data:
  nats_data:
  celery_beat_schedule:
