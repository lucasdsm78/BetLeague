services:
  db:
    image: postgres:15-alpine
    container_name: my_shared_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: betleague
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

#  frontend:
#    build:
#      context: front
#      dockerfile: Dockerfile.dev
#    container_name: react_frontend
#    ports:
#      - "3000:3000"
#    volumes:
#      - ./front:/app
#      - /app/node_modules
#    environment:
#      - CHOKIDAR_USEPOLLING=true
#    depends_on:
#      - backend

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics status && nc -z localhost 5672"]
      interval: 5s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: redis
    expose:
      - "6379"
    volumes:
      - ./redis/redis.conf.template:/usr/local/etc/redis/redis.conf.template:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password_change_me}
    command:
      - sh
      - -lc
      - |
        set -e
        if [ -z "${REDIS_PASSWORD}" ]; then echo "REDIS_PASSWORD is required" >&2; exit 1; fi
        # Escape '\\', '&' and '/' for sed replacement
        esc_pw=$$(printf '%s' "$$REDIS_PASSWORD" | sed -e 's/[\\/&]/\\\\&/g')
        sed "s/__REDIS_PASSWORD__/$${esc_pw}/g" /usr/local/etc/redis/redis.conf.template > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: back
      dockerfile: Dockerfile
    container_name: fastapi_app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./back:/app
    ports:
      - "8001:8001"
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/betleague
      RABBITMQ_URL: "amqp://user:password@rabbitmq:5672/"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/0"
      NOTIFICATIONS_REALTIME_DRIVER: "redis"
    depends_on:
      - db
      - rabbitmq
      - redis

  scrapper:
    build: ../ScrapperBet
    container_name: scrapper_app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../ScrapperBet:/app
    ports:
      - "8000:8000"
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/betleague
    depends_on:
      - backend
      - db

  score_consumer:
    build:
      context: back
      dockerfile: consumer_match_choice.Dockerfile
    container_name: score_consumer
    env_file:
      - back/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: always

  match_choice_consumer:
    build:
      context: back
      dockerfile: consumer_ticket.Dockerfile
    container_name: match_choice_consumer
    env_file:
      - back/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: always

  outbox_worker:
    build:
      context: back
      dockerfile: Dockerfile
    container_name: outbox_worker
    command: python outbox_worker_main.py
    volumes:
      - ./back:/app
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/betleague
      RABBITMQ_URL: "amqp://user:password@rabbitmq:5672/"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/0"
      NOTIFICATIONS_REALTIME_DRIVER: "redis"
      OUTBOX_BATCH_SIZE: 50
      OUTBOX_POLL_INTERVAL_MS: 250
      OUTBOX_MAX_POLL_INTERVAL_MS: 5000
      OUTBOX_JITTER_MS: 150
      OUTBOX_WORKER_ID: outbox_worker_1
      OUTBOX_LOCK_TTL_MS: 120000
    depends_on:
      - db
      - backend
      - redis
    restart: always

volumes:
  db_data:
