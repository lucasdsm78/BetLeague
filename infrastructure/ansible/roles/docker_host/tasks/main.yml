---
- name: Installer Docker Engine et le plugin Compose
  ansible.builtin.apt:
    name: "{{ betleague_docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Déployer la configuration sécurisée du daemon Docker
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  notify: Restart docker

- name: Ajouter l'utilisateur runtime au groupe docker
  ansible.builtin.user:
    name: "{{ betleague_runtime_user }}"
    groups: docker
    append: true

- name: Activer Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

