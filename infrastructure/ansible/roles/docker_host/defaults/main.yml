---
betleague_runtime_user: "{{ ansible_user | default('betleague') }}"
betleague_docker_engine_packages:
  - docker.io
betleague_docker_compose_package_candidates:
  - docker-compose-plugin
  - docker-compose-v2
  - docker-compose
betleague_docker_daemon_config:
  live-restore: true
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: '5'
  userland-proxy: false
  icc: false
  no-new-privileges: true
  features:
    buildkit: true


