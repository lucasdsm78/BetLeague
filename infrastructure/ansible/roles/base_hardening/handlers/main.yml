---
- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload ufw
  ansible.builtin.command: ufw reload
  changed_when: true

- name: Reload fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: reloaded

- name: Restart systemd-resolved
  ansible.builtin.service:
    name: systemd-resolved
    state: restarted



