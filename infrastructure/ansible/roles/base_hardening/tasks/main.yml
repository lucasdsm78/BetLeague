---
- name: Vérifier le système supporté
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
    fail_msg: >-
      Ce rôle est conçu pour Ubuntu/Debian, cohérent avec le bootstrap OVH actuel.

- name: Vérifier que des CIDR SSH de confiance sont explicitement fournis
  ansible.builtin.assert:
    that:
      - betleague_ssh_trusted_cidrs | length > 0
      - betleague_ssh_trusted_cidrs | map('regex_search', '^[0-9a-fA-F:.]+/[0-9]{1,3}$') | list | select('equalto', None) | list | length == 0
    fail_msg: >-
      `betleague_ssh_trusted_cidrs` doit contenir au moins un CIDR valide avant d'appliquer `base_hardening`,
      afin d'éviter tout lockout SSH.

- name: Installer les paquets de hardening
  ansible.builtin.apt:
    name: "{{ betleague_hardening_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Garantir la présence du répertoire SSH de l'administrateur
  ansible.builtin.file:
    path: "/home/{{ betleague_admin_user }}/.ssh"
    state: directory
    owner: "{{ betleague_admin_user }}"
    group: "{{ betleague_admin_user }}"
    mode: '0700'
  when: betleague_admin_authorized_public_keys | length > 0

- name: Installer les clés publiques SSH autorisées pour l'administrateur
  ansible.posix.authorized_key:
    user: "{{ betleague_admin_user }}"
    key: "{{ item }}"
    state: present
    manage_dir: false
  loop: "{{ betleague_admin_authorized_public_keys | unique }}"
  when: betleague_admin_authorized_public_keys | length > 0

- name: Configurer les mises à jour de sécurité automatiques
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'

- name: Configurer les origines autorisées pour unattended-upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: '0644'

- name: Durcir la configuration SSH
  ansible.builtin.template:
    src: sshd_config_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-betleague-hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart ssh

- name: Valider la configuration SSH globale
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Déployer la configuration sysctl de hardening
  ansible.builtin.template:
    src: 99-betleague-hardening.conf.j2
    dest: /etc/sysctl.d/99-betleague-hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload sysctl

- name: Configurer la politique d'expiration des mots de passe
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^{{ item.key }}'
    line: '{{ item.key }}\t{{ item.value }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - { key: 'PASS_MAX_DAYS', value: '90' }
    - { key: 'PASS_MIN_DAYS', value: '1' }
    - { key: 'PASS_WARN_AGE', value: '14' }

- name: Déployer la prison fail2ban SSHD
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: '0644'
  when: betleague_enable_fail2ban | bool
  notify: Reload fail2ban

- name: Activer auditd
  ansible.builtin.service:
    name: auditd
    enabled: true
    state: started

- name: Forcer la prise en charge IPv6 dans UFW
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^IPV6='
    line: 'IPV6={{ betleague_ufw_ipv6 | bool | ternary("yes", "no") }}'
    owner: root
    group: root
    mode: '0644'
  notify: Reload ufw

- name: Définir la politique de forwarding UFW sur DROP
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="DROP"'
    owner: root
    group: root
    mode: '0644'
  notify: Reload ufw

- name: Vérifier la présence du fichier UFW IPv4 after.rules
  ansible.builtin.stat:
    path: /etc/ufw/after.rules
  register: betleague_ufw_after_rules_stat
  when: betleague_ufw_docker_enabled | bool

- name: Vérifier la présence du squelette UFW IPv4 embarqué
  ansible.builtin.stat:
    path: /usr/share/ufw/after.rules
  register: betleague_ufw_after_rules_packaged_stat
  when: betleague_ufw_docker_enabled | bool

- name: Initialiser le fichier UFW IPv4 after.rules depuis le squelette embarqué
  ansible.builtin.copy:
    src: /usr/share/ufw/after.rules
    dest: /etc/ufw/after.rules
    remote_src: true
    owner: root
    group: root
    mode: '0644'
  when:
    - betleague_ufw_docker_enabled | bool
    - not betleague_ufw_after_rules_stat.stat.exists
    - betleague_ufw_after_rules_packaged_stat.stat.exists
  notify: Reload ufw

- name: Initialiser le fichier UFW IPv4 after.rules avec un squelette minimal valide
  ansible.builtin.copy:
    dest: /etc/ufw/after.rules
    content: |
      *filter

      COMMIT
    owner: root
    group: root
    mode: '0644'
  when:
    - betleague_ufw_docker_enabled | bool
    - not betleague_ufw_after_rules_stat.stat.exists
    - not betleague_ufw_after_rules_packaged_stat.stat.exists
  notify: Reload ufw

- name: Vérifier la présence du fichier UFW IPv6 after6.rules
  ansible.builtin.stat:
    path: /etc/ufw/after6.rules
  register: betleague_ufw_after6_rules_stat
  when:
    - betleague_ufw_docker_enabled | bool
    - betleague_ufw_ipv6 | bool

- name: Vérifier la présence du squelette UFW IPv6 embarqué
  ansible.builtin.stat:
    path: /usr/share/ufw/after6.rules
  register: betleague_ufw_after6_rules_packaged_stat
  when:
    - betleague_ufw_docker_enabled | bool
    - betleague_ufw_ipv6 | bool

- name: Initialiser le fichier UFW IPv6 after6.rules depuis le squelette embarqué
  ansible.builtin.copy:
    src: /usr/share/ufw/after6.rules
    dest: /etc/ufw/after6.rules
    remote_src: true
    owner: root
    group: root
    mode: '0644'
  when:
    - betleague_ufw_docker_enabled | bool
    - betleague_ufw_ipv6 | bool
    - not betleague_ufw_after6_rules_stat.stat.exists
    - betleague_ufw_after6_rules_packaged_stat.stat.exists
  notify: Reload ufw

- name: Initialiser le fichier UFW IPv6 after6.rules avec un squelette minimal valide
  ansible.builtin.copy:
    dest: /etc/ufw/after6.rules
    content: |
      *filter

      COMMIT
    owner: root
    group: root
    mode: '0644'
  when:
    - betleague_ufw_docker_enabled | bool
    - betleague_ufw_ipv6 | bool
    - not betleague_ufw_after6_rules_stat.stat.exists
    - not betleague_ufw_after6_rules_packaged_stat.stat.exists
  notify: Reload ufw

- name: Déployer la chaîne UFW de protection Docker
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    insertbefore: '^COMMIT$'
    marker: '# {mark} ANSIBLE MANAGED BLOCK BETLEAGUE DOCKER'
    block: |
      :btl-docker-log-deny - [0:0]
      :DOCKER-USER - [0:0]
      {{ lookup('template', 'ufw-docker-user.rules.j2') }}
  when: betleague_ufw_docker_enabled | bool
  notify: Reload ufw

- name: Déployer la chaîne UFW IPv6 de protection Docker
  ansible.builtin.blockinfile:
    path: /etc/ufw/after6.rules
    insertbefore: '^COMMIT$'
    marker: '# {mark} ANSIBLE MANAGED BLOCK BETLEAGUE DOCKER IPV6'
    block: |
      :btl-docker-log-deny - [0:0]
      :DOCKER-USER - [0:0]
      {{ lookup('template', 'ufw-docker-user-ipv6.rules.j2') }}
  when:
    - betleague_ufw_docker_enabled | bool
    - betleague_ufw_ipv6 | bool
  notify: Reload ufw

- name: Définir la politique UFW par défaut sur deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Définir la politique UFW par défaut sur allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Autoriser SSH seulement depuis les CIDR de confiance
  community.general.ufw:
    rule: limit
    src: "{{ item }}"
    port: "{{ betleague_ssh_port | string }}"
    proto: tcp
  loop: "{{ betleague_ssh_trusted_cidrs }}"

- name: Autoriser les ports publics applicatifs
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ betleague_public_tcp_ports }}"

- name: Activer les logs UFW
  community.general.ufw:
    logging: "{{ betleague_ufw_logging }}"

- name: Activer UFW
  community.general.ufw:
    state: enabled

- name: Activer fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: betleague_enable_fail2ban | bool









