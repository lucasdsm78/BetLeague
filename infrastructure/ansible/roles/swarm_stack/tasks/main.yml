---
- name: Préparer le runtime Swarm
  ansible.builtin.include_tasks: _prepare_runtime.yml

- name: Appliquer les migrations DB avant le rolling update backend
  # Les fichiers backend.env / migrations.env sont copiés côté hôte en 0600 root:root.
  # Avec un bind mount Docker classique, ils restent lisibles uniquement par root dans le conteneur.
  # Contrairement aux secrets Swarm, on ne peut pas définir ici uid/gid/mode par fichier.
  # On exécute donc ce conteneur one-shot en root pour lire les env files avant le déploiement de la stack.
  # Le mode `host` évite aussi les écarts de routage/NAT entre le bridge Docker par défaut et l'hôte,
  # ce qui fiabilise l'accès aux bases managées/privées avant `docker stack deploy`.
  ansible.builtin.command: >-
    docker run --rm
    --network host
    --user 0:0
    --env TMPDIR={{ betleague_swarm_python_temp }}
    --env TEMP={{ betleague_swarm_python_temp }}
    --env TMP={{ betleague_swarm_python_tmp }}
    --mount type=bind,src={{ betleague_swarm_deploy_path }}/secrets/backend.env,dst=/run/secrets/backend_env,ro
    --mount type=bind,src={{ betleague_swarm_deploy_path }}/secrets/migrations.env,dst=/run/secrets/migrations_env,ro
    {{ betleague_swarm_backend_image }}
    python scripts/run_with_env_files.py /run/secrets/backend_env /run/secrets/migrations_env -- ./scripts/run_migrations.sh
  register: betleague_swarm_migrations_result
  changed_when: false
  when: not (betleague_swarm_internal_postgres_enabled | bool)

- name: Déployer la stack Swarm BetLeague
  ansible.builtin.command: docker stack deploy --with-registry-auth -c stack.prod.yml {{ betleague_swarm_stack_name }}
  args:
    chdir: "{{ betleague_swarm_deploy_path }}"
  environment:
    BETLEAGUE_BACKEND_IMAGE: "{{ betleague_swarm_backend_image }}"
    BETLEAGUE_FRONTEND_IMAGE: "{{ betleague_swarm_frontend_image }}"
    BETLEAGUE_INTERNAL_POSTGRES_REPLICAS: "{{ (betleague_swarm_internal_postgres_enabled | bool) | ternary('1', '0') }}"
    BETLEAGUE_POSTGRES_IMAGE: "{{ betleague_swarm_postgres_image }}"
    BETLEAGUE_POSTGRES_DATABASE: "{{ betleague_swarm_postgres_database }}"
    BETLEAGUE_POSTGRES_SUPERUSER: "{{ betleague_swarm_postgres_superuser }}"
    BETLEAGUE_POSTGRES_PLACEMENT_CONSTRAINT: "{{ betleague_swarm_postgres_placement_constraint }}"
    BETLEAGUE_API_DOMAIN: "{{ betleague_swarm_api_domain }}"
    BETLEAGUE_GRAFANA_DOMAIN: "{{ betleague_swarm_grafana_domain }}"
    BETLEAGUE_PROMETHEUS_DOMAIN: "{{ betleague_swarm_prometheus_domain }}"
    GUNICORN_WORKERS: "{{ betleague_swarm_gunicorn_workers | string }}"
    GUNICORN_FORWARDED_ALLOW_IPS: "{{ betleague_swarm_gunicorn_forwarded_allow_ips }}"
    BETLEAGUE_SWARM_UPDATE_FAILURE_ACTION: "{{ betleague_swarm_update_failure_action }}"
    BETLEAGUE_PYTHON_TEMP: "{{ betleague_swarm_python_temp }}"
    BETLEAGUE_PYTHON_TMP: "{{ betleague_swarm_python_tmp }}"
    BETLEAGUE_EDGE_ACME_WEBROOT: "{{ betleague_swarm_edge_acme_webroot }}"
    BETLEAGUE_EDGE_TLS_DIR: "{{ betleague_swarm_edge_tls_dir }}"
    BETLEAGUE_EDGE_TLS_GID: "{{ betleague_swarm_edge_tls_gid | string }}"
    BETLEAGUE_EDGE_NGINX_CONF_CONFIG_NAME: "{{ betleague_swarm_edge_nginx_conf_config_name }}"
    BETLEAGUE_REDIS_CONF_TEMPLATE_CONFIG_NAME: "{{ betleague_swarm_redis_conf_template_config_name }}"
    BETLEAGUE_NATS_SERVER_CONF_CONFIG_NAME: "{{ betleague_swarm_nats_server_conf_config_name }}"
    BETLEAGUE_PROMETHEUS_CONF_CONFIG_NAME: "{{ betleague_swarm_prometheus_conf_config_name }}"
    BETLEAGUE_PROMETHEUS_ALERTS_CONFIG_NAME: "{{ betleague_swarm_prometheus_alerts_config_name }}"
    BETLEAGUE_GRAFANA_DATASOURCES_CONFIG_NAME: "{{ betleague_swarm_grafana_datasources_config_name }}"
    BETLEAGUE_GRAFANA_DASHBOARDS_CONFIG_NAME: "{{ betleague_swarm_grafana_dashboards_config_name }}"
    BETLEAGUE_GRAFANA_SYSTEM_OVERVIEW_DASHBOARD_CONFIG_NAME: "{{ betleague_swarm_grafana_system_overview_dashboard_config_name }}"
    BETLEAGUE_GRAFANA_LEAGUE_PAYOUT_OVERDUE_DASHBOARD_CONFIG_NAME: "{{ betleague_swarm_grafana_league_payout_overdue_dashboard_config_name }}"
    BETLEAGUE_POSTGRES_INIT_BETLEAGUE_CONFIG_NAME: "{{ betleague_swarm_postgres_init_betleague_config_name }}"
    BETLEAGUE_BACKEND_ENV_SECRET_NAME: "{{ betleague_swarm_backend_env_secret_name }}"
    BETLEAGUE_MIGRATIONS_ENV_SECRET_NAME: "{{ betleague_swarm_migrations_env_secret_name }}"
    BETLEAGUE_POSTGRES_SUPERUSER_PASSWORD_SECRET_NAME: "{{ betleague_swarm_postgres_superuser_password_secret_name }}"
    BETLEAGUE_POSTGRES_APP_PASSWORD_SECRET_NAME: "{{ betleague_swarm_postgres_app_password_secret_name }}"
    BETLEAGUE_POSTGRES_MIGRATIONS_PASSWORD_SECRET_NAME: "{{ betleague_swarm_postgres_migrations_password_secret_name }}"
    BETLEAGUE_GRAFANA_ADMIN_PASSWORD_SECRET_NAME: "{{ betleague_swarm_grafana_admin_password_secret_name }}"
    BETLEAGUE_GRAFANA_SECRET_KEY_SECRET_NAME: "{{ betleague_swarm_grafana_secret_key_secret_name }}"
    BETLEAGUE_MONITORING_HTPASSWD_SECRET_NAME: "{{ betleague_swarm_monitoring_htpasswd_secret_name }}"
    BETLEAGUE_ALERTMANAGER_CONFIG_SECRET_NAME: "{{ betleague_swarm_alertmanager_config_secret_name }}"
    BETLEAGUE_ALERTMANAGER_REPLICAS: "{{ (betleague_swarm_alertmanager_enabled | default(false)) | ternary('1', '0') }}"
    BETLEAGUE_REDIS_PASSWORD_SECRET_NAME: "{{ betleague_swarm_redis_password_secret_name }}"
    BETLEAGUE_NATS_USER_SECRET_NAME: "{{ betleague_swarm_nats_user_secret_name }}"
    BETLEAGUE_NATS_PASSWORD_SECRET_NAME: "{{ betleague_swarm_nats_password_secret_name }}"
    BETLEAGUE_NATS_CA_CERT_SECRET_NAME: "{{ betleague_swarm_nats_ca_cert_secret_name }}"
    BETLEAGUE_NATS_SERVER_CERT_SECRET_NAME: "{{ betleague_swarm_nats_server_cert_secret_name }}"
    BETLEAGUE_NATS_SERVER_KEY_SECRET_NAME: "{{ betleague_swarm_nats_server_key_secret_name }}"
    BETLEAGUE_NATS_CLIENT_CERT_SECRET_NAME: "{{ betleague_swarm_nats_client_cert_secret_name }}"
    BETLEAGUE_NATS_CLIENT_KEY_SECRET_NAME: "{{ betleague_swarm_nats_client_key_secret_name }}"
    BETLEAGUE_PROMETHEUS_RETENTION_TIME: "{{ betleague_swarm_prometheus_retention_time }}"
    BETLEAGUE_PROMETHEUS_RETENTION_SIZE: "{{ betleague_swarm_prometheus_retention_size }}"
  register: betleague_swarm_deploy_result
  changed_when: >-
    'Updating service' in betleague_swarm_deploy_result.stdout or
    'Creating service' in betleague_swarm_deploy_result.stdout or
    'Creating network' in betleague_swarm_deploy_result.stdout or
    'Creating secret' in betleague_swarm_deploy_result.stdout or
    'Creating config' in betleague_swarm_deploy_result.stdout

- name: Attendre la convergence du service PostgreSQL interne
  ansible.builtin.shell: |
    set -euo pipefail
    replicas="$(docker service ls --filter name=^{{ betleague_swarm_stack_name }}_postgres$ --format '{{"{{.Replicas}}"}}')"
    test -n "$replicas"
    running="${replicas%%/*}"
    desired="${replicas##*/}"
    test "$running" = "$desired"
    test "$desired" = "1"
  args:
    executable: /bin/bash
  register: betleague_swarm_postgres_wait
  retries: "{{ (betleague_swarm_wait_timeout_seconds // betleague_swarm_wait_sleep_seconds) | int }}"
  delay: "{{ betleague_swarm_wait_sleep_seconds }}"
  until: betleague_swarm_postgres_wait.rc == 0
  changed_when: false
  when: betleague_swarm_internal_postgres_enabled | bool

- name: Lancer le service one-shot de migrations après déploiement de la stack
  ansible.builtin.command: >-
    docker service scale
    {{ betleague_swarm_stack_name }}_migrations=1
  changed_when: true
  when: betleague_swarm_internal_postgres_enabled | bool

- name: Attendre la fin des migrations one-shot après déploiement de la stack
  ansible.builtin.shell: |
    set -euo pipefail
    state="$(docker service ps {{ betleague_swarm_stack_name }}_migrations --no-trunc --format '{{"{{.CurrentState}}"}}' | head -n 1)"
    if [[ "$state" == Complete* ]]; then
      exit 0
    fi
    if [[ "$state" == Failed* || "$state" == Rejected* ]]; then
      echo "$state" >&2
      exit 2
    fi
    exit 1
  args:
    executable: /bin/bash
  register: betleague_swarm_internal_postgres_migrations_wait
  retries: "{{ (betleague_swarm_wait_timeout_seconds // betleague_swarm_wait_sleep_seconds) | int }}"
  delay: "{{ betleague_swarm_wait_sleep_seconds }}"
  until: betleague_swarm_internal_postgres_migrations_wait.rc == 0
  changed_when: false
  when: betleague_swarm_internal_postgres_enabled | bool

- name: Remettre le service de migrations à 0 replica après succès
  ansible.builtin.command: >-
    docker service scale
    {{ betleague_swarm_stack_name }}_migrations=0
  changed_when: true
  when: betleague_swarm_internal_postgres_enabled | bool

- name: Attendre que les services Swarm convergent
  block:
    - name: Vérifier la convergence des services Swarm
      ansible.builtin.shell: |
        set -euo pipefail
        stack_name="{{ betleague_swarm_stack_name }}"
        lines=$(docker stack services "$stack_name" --format '{{"{{.Name}} {{.Replicas}}"}}')
        test -n "$lines"
        pending_services=""
        while IFS= read -r line; do
          name="${line%% *}"
          if [[ "$name" == *"_jetstream_provision" ]]; then
            continue
          fi
          replicas="${line##* }"
          running="${replicas%%/*}"
          desired="${replicas##*/}"
          if [[ "$running" != "$desired" ]]; then
            pending_services+=" - $line"$'\n'
          fi
        done <<< "$lines"
        if [[ -n "$pending_services" ]]; then
          printf 'Services Swarm non converges pour %s:\n' "$stack_name"
          printf '%s' "$pending_services"
          exit 1
        fi
        printf 'Tous les services Swarm ont converge pour %s.\n' "$stack_name"
      args:
        executable: /bin/bash
      register: betleague_swarm_wait_services
      retries: "{{ (betleague_swarm_wait_timeout_seconds // betleague_swarm_wait_sleep_seconds) | int }}"
      delay: "{{ betleague_swarm_wait_sleep_seconds }}"
      until: betleague_swarm_wait_services.rc == 0
      changed_when: false
  rescue:
    - name: Capturer l'état courant des services de la stack Swarm
      ansible.builtin.command: docker stack services {{ betleague_swarm_stack_name }}
      register: betleague_swarm_services_state
      changed_when: false
      failed_when: false

    - name: Identifier les services Swarm non convergés
      ansible.builtin.shell: |
        set -euo pipefail
        stack_name="{{ betleague_swarm_stack_name }}"
        docker stack services "$stack_name" --format '{{"{{.Name}} {{.Replicas}}"}}' | while IFS= read -r line; do
          name="${line%% *}"
          replicas="${line##* }"
          running="${replicas%%/*}"
          desired="${replicas##*/}"
          if [[ "$name" == *"_jetstream_provision" ]]; then
            continue
          fi
          if [[ "$running" != "$desired" ]]; then
            printf '%s\n' "$name"
          fi
        done
      args:
        executable: /bin/bash
      register: betleague_swarm_non_converged_services
      changed_when: false
      failed_when: false

    - name: Capturer l'état courant des tâches de la stack Swarm
      ansible.builtin.command: docker stack ps --no-trunc {{ betleague_swarm_stack_name }}
      register: betleague_swarm_tasks_state
      changed_when: false
      failed_when: false

    - name: Capturer les diagnostics détaillés des services Swarm non convergés
      ansible.builtin.shell: |
        set -euo pipefail
        services="{{ betleague_swarm_non_converged_services.stdout_lines | default([]) | join(' ') }}"
        if [[ -z "$services" ]]; then
          echo "Aucun service non convergé identifié."
          exit 0
        fi

        for service in $services; do
          printf '\n===== %s: inspect =====\n' "$service"
          docker service inspect "$service" \
            --format 'Image={{"{{.Spec.TaskTemplate.ContainerSpec.Image}}"}} UpdateState={{"{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}"}} UpdateMessage={{"{{if .UpdateStatus}}{{.UpdateStatus.Message}}{{end}}"}}' \
            || true

          printf '\n===== %s: tasks =====\n' "$service"
          docker service ps --no-trunc "$service" || true

          printf '\n===== %s: logs since {{ betleague_swarm_diagnostics_logs_since }} =====\n' "$service"
          docker service logs \
            --since "{{ betleague_swarm_diagnostics_logs_since }}" \
            --tail "{{ betleague_swarm_diagnostics_logs_tail }}" \
            "$service" 2>&1 || true
        done
      args:
        executable: /bin/bash
      register: betleague_swarm_non_converged_diagnostics
      changed_when: false
      failed_when: false

    - name: Afficher le détail des services Swarm non convergés
      ansible.builtin.debug:
        msg:
          - "La stack {{ betleague_swarm_stack_name }} n'a pas convergé dans le délai imparti ({{ betleague_swarm_wait_timeout_seconds }}s)."
          - "Services:"
          - "{{ betleague_swarm_services_state.stdout | default('Aucune sortie docker stack services') }}"
          - "Tâches:"
          - "{{ betleague_swarm_tasks_state.stdout | default('Aucune sortie docker stack ps') }}"
          - "Diagnostics services non convergés:"
          - "{{ betleague_swarm_non_converged_diagnostics.stdout | default('Aucun diagnostic détaillé disponible') }}"

    - name: Échouer explicitement si la stack Swarm ne converge pas
      ansible.builtin.fail:
        msg: >-
          La stack {{ betleague_swarm_stack_name }} n'a pas convergé dans le délai imparti.
          Inspecte les sorties `docker stack services {{ betleague_swarm_stack_name }}` et
          `docker stack ps --no-trunc {{ betleague_swarm_stack_name }}` affichées juste avant pour identifier
          le service bloquant (image, healthcheck, crashloop, rollback ou dépendance indisponible).

- name: Vérifier la santé de l'API après déploiement de la stack
  block:
    - name: Vérifier la santé de l'API après déploiement de la stack
      ansible.builtin.uri:
        url: "{{ betleague_swarm_api_healthcheck_url }}"
        method: GET
        return_content: false
        status_code: 200
        validate_certs: "{{ not (betleague_letsencrypt_enabled | default(false) | bool) and not (betleague_letsencrypt_staging | default(false) | bool) }}"
      register: betleague_swarm_api_health
      retries: 12
      delay: 5
      until: betleague_swarm_api_health.status == 200
      delegate_to: localhost
      become: false

  rescue:
    - name: Diagnostiquer DNS et connectivité API depuis le contrôleur
      ansible.builtin.shell: |
        set -u
        url="{{ betleague_swarm_api_healthcheck_url }}"
        host="$(python3 - <<'PY' "$url"
        from urllib.parse import urlparse
        import sys
        print(urlparse(sys.argv[1]).hostname or "")
        PY
        )"

        printf 'URL: %s\nHost: %s\n\n' "$url" "$host"

        python3 - <<'PY' "$host"
        import socket
        import sys

        host = sys.argv[1]
        print("=== DNS getaddrinfo ===")
        try:
            infos = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
        except Exception as exc:
            print(f"DNS error: {exc!r}")
            raise SystemExit(0)

        seen = []
        for family, _type, _proto, _canon, sockaddr in infos:
            address = sockaddr[0]
            if (family, address) in seen:
                continue
            seen.append((family, address))
            label = "IPv6" if family == socket.AF_INET6 else "IPv4"
            print(f"{label} {address}")

        print("\n=== TCP 443 connect ===")
        for family, address in seen:
            label = "IPv6" if family == socket.AF_INET6 else "IPv4"
            try:
                with socket.create_connection((address, 443), timeout=5):
                    print(f"{label} {address}: CONNECT OK")
            except Exception as exc:
                print(f"{label} {address}: CONNECT FAILED: {exc!r}")
        PY

        if command -v curl >/dev/null 2>&1; then
          printf '\n=== curl IPv4 ===\n'
          curl -4 -vk --connect-timeout 10 --max-time 20 "$url" -o /dev/null || true
          printf '\n=== curl IPv6 ===\n'
          curl -6 -vk --connect-timeout 10 --max-time 20 "$url" -o /dev/null || true
        fi
      args:
        executable: /bin/bash
      register: betleague_swarm_public_api_controller_diagnostics
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false

    - name: Diagnostiquer l'exposition edge sur l'hôte Swarm
      ansible.builtin.shell: |
        set -u
        printf '=== docker service inspect edge ports ===\n'
        docker service inspect {{ betleague_swarm_stack_name }}_edge \
          --format 'Ports={{"{{json .Endpoint.Spec.Ports}}"}} UpdateStatus={{"{{json .UpdateStatus}}"}}' || true

        printf '\n=== sockets 80/443 ===\n'
        ss -ltnp | grep -E '(:80|:443)[[:space:]]' || true

        printf '\n=== edge tasks ===\n'
        docker service ps --no-trunc {{ betleague_swarm_stack_name }}_edge || true

        printf '\n=== edge logs ===\n'
        docker service logs --since 15m --tail 200 {{ betleague_swarm_stack_name }}_edge 2>&1 || true
      args:
        executable: /bin/bash
      register: betleague_swarm_public_api_edge_diagnostics
      changed_when: false
      failed_when: false

    - name: Afficher les diagnostics d'accès public API
      ansible.builtin.debug:
        msg:
          - "Le smoke test public {{ betleague_swarm_api_healthcheck_url }} a échoué."
          - "Note: lorsque Let's Encrypt est activé, ce test pré-émission TLS accepte le certificat autosigné de bootstrap ; le test strict est exécuté après certbot dans deploy_swarm.yml."
          - "Diagnostics contrôleur:"
          - "{{ betleague_swarm_public_api_controller_diagnostics.stdout | default('Aucun diagnostic contrôleur') }}"
          - "Diagnostics edge VPS:"
          - "{{ betleague_swarm_public_api_edge_diagnostics.stdout | default('Aucun diagnostic edge') }}"

    - name: Échouer explicitement si la santé publique API reste indisponible
      ansible.builtin.fail:
        msg: >-
          L'API publique {{ betleague_swarm_api_healthcheck_url }} n'est pas joignable depuis le contrôleur.
          Vérifie en priorité DNS A/AAAA, publication des ports 80/443 du service edge, firewall hôte/provider,
          certificat TLS de bootstrap si Let's Encrypt est désactivé, et logs Nginx edge affichés dans les diagnostics ci-dessus.

















