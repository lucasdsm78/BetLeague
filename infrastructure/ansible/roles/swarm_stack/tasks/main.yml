---
- name: Préparer le runtime Swarm
  ansible.builtin.include_tasks: _prepare_runtime.yml

- name: Appliquer les migrations DB avant le rolling update backend
  # Les fichiers backend.env / migrations.env sont copiés côté hôte en 0600 root:root.
  # Avec un bind mount Docker classique, ils restent lisibles uniquement par root dans le conteneur.
  # Contrairement aux secrets Swarm, on ne peut pas définir ici uid/gid/mode par fichier.
  # On exécute donc ce conteneur one-shot en root pour lire les env files avant le déploiement de la stack.
  ansible.builtin.command: >-
    docker run --rm
    --user 0:0
    --env TMPDIR={{ betleague_swarm_python_temp }}
    --env TEMP={{ betleague_swarm_python_temp }}
    --env TMP={{ betleague_swarm_python_tmp }}
    --mount type=bind,src={{ betleague_swarm_deploy_path }}/secrets/backend.env,dst=/run/secrets/backend_env,ro
    --mount type=bind,src={{ betleague_swarm_deploy_path }}/secrets/migrations.env,dst=/run/secrets/migrations_env,ro
    {{ betleague_swarm_backend_image }}
    python scripts/run_with_env_files.py /run/secrets/backend_env /run/secrets/migrations_env -- ./scripts/run_migrations.sh
  register: betleague_swarm_migrations_result
  changed_when: false

- name: Déployer la stack Swarm BetLeague
  ansible.builtin.command: docker stack deploy --with-registry-auth -c stack.prod.yml {{ betleague_swarm_stack_name }}
  args:
    chdir: "{{ betleague_swarm_deploy_path }}"
  environment:
    BETLEAGUE_BACKEND_IMAGE: "{{ betleague_swarm_backend_image }}"
    BETLEAGUE_FRONTEND_IMAGE: "{{ betleague_swarm_frontend_image }}"
    GUNICORN_WORKERS: "{{ betleague_swarm_gunicorn_workers | string }}"
    GUNICORN_FORWARDED_ALLOW_IPS: "{{ betleague_swarm_gunicorn_forwarded_allow_ips }}"
    BETLEAGUE_PYTHON_TEMP: "{{ betleague_swarm_python_temp }}"
    BETLEAGUE_PYTHON_TMP: "{{ betleague_swarm_python_tmp }}"
    BETLEAGUE_EDGE_ACME_WEBROOT: "{{ betleague_swarm_edge_acme_webroot }}"
    BETLEAGUE_EDGE_TLS_DIR: "{{ betleague_swarm_edge_tls_dir }}"
    BETLEAGUE_EDGE_TLS_GID: "{{ betleague_swarm_edge_tls_gid | string }}"
    BETLEAGUE_EDGE_NGINX_CONF_CONFIG_NAME: "{{ betleague_swarm_edge_nginx_conf_config_name }}"
    BETLEAGUE_REDIS_CONF_TEMPLATE_CONFIG_NAME: "{{ betleague_swarm_redis_conf_template_config_name }}"
    BETLEAGUE_NATS_SERVER_CONF_CONFIG_NAME: "{{ betleague_swarm_nats_server_conf_config_name }}"
    BETLEAGUE_BACKEND_ENV_SECRET_NAME: "{{ betleague_swarm_backend_env_secret_name }}"
    BETLEAGUE_MIGRATIONS_ENV_SECRET_NAME: "{{ betleague_swarm_migrations_env_secret_name }}"
    BETLEAGUE_REDIS_PASSWORD_SECRET_NAME: "{{ betleague_swarm_redis_password_secret_name }}"
    BETLEAGUE_NATS_USER_SECRET_NAME: "{{ betleague_swarm_nats_user_secret_name }}"
    BETLEAGUE_NATS_PASSWORD_SECRET_NAME: "{{ betleague_swarm_nats_password_secret_name }}"
    BETLEAGUE_NATS_CA_CERT_SECRET_NAME: "{{ betleague_swarm_nats_ca_cert_secret_name }}"
    BETLEAGUE_NATS_SERVER_CERT_SECRET_NAME: "{{ betleague_swarm_nats_server_cert_secret_name }}"
    BETLEAGUE_NATS_SERVER_KEY_SECRET_NAME: "{{ betleague_swarm_nats_server_key_secret_name }}"
    BETLEAGUE_NATS_CLIENT_CERT_SECRET_NAME: "{{ betleague_swarm_nats_client_cert_secret_name }}"
    BETLEAGUE_NATS_CLIENT_KEY_SECRET_NAME: "{{ betleague_swarm_nats_client_key_secret_name }}"
  register: betleague_swarm_deploy_result
  changed_when: >-
    'Updating service' in betleague_swarm_deploy_result.stdout or
    'Creating service' in betleague_swarm_deploy_result.stdout or
    'Creating network' in betleague_swarm_deploy_result.stdout or
    'Creating secret' in betleague_swarm_deploy_result.stdout or
    'Creating config' in betleague_swarm_deploy_result.stdout

- name: Attendre que les services Swarm convergent
  block:
    - name: Vérifier la convergence des services Swarm
      ansible.builtin.shell: |
        set -euo pipefail
        stack_name="{{ betleague_swarm_stack_name }}"
        lines=$(docker stack services "$stack_name" --format '{{"{{.Name}} {{.Replicas}}"}}')
        test -n "$lines"
        pending_services=""
        while IFS= read -r line; do
          name="${line%% *}"
          if [[ "$name" == *"_jetstream_provision" ]]; then
            continue
          fi
          replicas="${line##* }"
          running="${replicas%%/*}"
          desired="${replicas##*/}"
          if [[ "$running" != "$desired" ]]; then
            pending_services+=" - $line"$'\n'
          fi
        done <<< "$lines"
        if [[ -n "$pending_services" ]]; then
          printf 'Services Swarm non converges pour %s:\n' "$stack_name"
          printf '%s' "$pending_services"
          exit 1
        fi
        printf 'Tous les services Swarm ont converge pour %s.\n' "$stack_name"
      args:
        executable: /bin/bash
      register: betleague_swarm_wait_services
      retries: "{{ (betleague_swarm_wait_timeout_seconds // betleague_swarm_wait_sleep_seconds) | int }}"
      delay: "{{ betleague_swarm_wait_sleep_seconds }}"
      until: betleague_swarm_wait_services.rc == 0
      changed_when: false
  rescue:
    - name: Capturer l'état courant des services de la stack Swarm
      ansible.builtin.command: docker stack services {{ betleague_swarm_stack_name }}
      register: betleague_swarm_services_state
      changed_when: false
      failed_when: false

    - name: Identifier les services Swarm non convergés
      ansible.builtin.shell: |
        set -euo pipefail
        stack_name="{{ betleague_swarm_stack_name }}"
        docker stack services "$stack_name" --format '{{"{{.Name}} {{.Replicas}}"}}' | while IFS= read -r line; do
          name="${line%% *}"
          replicas="${line##* }"
          running="${replicas%%/*}"
          desired="${replicas##*/}"
          if [[ "$name" == *"_jetstream_provision" ]]; then
            continue
          fi
          if [[ "$running" != "$desired" ]]; then
            printf '%s\n' "$name"
          fi
        done
      args:
        executable: /bin/bash
      register: betleague_swarm_non_converged_services
      changed_when: false
      failed_when: false

    - name: Capturer l'état courant des tâches de la stack Swarm
      ansible.builtin.command: docker stack ps --no-trunc {{ betleague_swarm_stack_name }}
      register: betleague_swarm_tasks_state
      changed_when: false
      failed_when: false

    - name: Capturer les diagnostics détaillés des services Swarm non convergés
      ansible.builtin.shell: |
        set -euo pipefail
        services="{{ betleague_swarm_non_converged_services.stdout_lines | default([]) | join(' ') }}"
        if [[ -z "$services" ]]; then
          echo "Aucun service non convergé identifié."
          exit 0
        fi

        for service in $services; do
          printf '\n===== %s: inspect =====\n' "$service"
          docker service inspect "$service" \
            --format 'Image={{"{{.Spec.TaskTemplate.ContainerSpec.Image}}"}} UpdateState={{"{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}"}} UpdateMessage={{"{{if .UpdateStatus}}{{.UpdateStatus.Message}}{{end}}"}}' \
            || true

          printf '\n===== %s: tasks =====\n' "$service"
          docker service ps --no-trunc "$service" || true

          printf '\n===== %s: logs since {{ betleague_swarm_diagnostics_logs_since }} =====\n' "$service"
          docker service logs \
            --since "{{ betleague_swarm_diagnostics_logs_since }}" \
            --tail "{{ betleague_swarm_diagnostics_logs_tail }}" \
            "$service" 2>&1 || true
        done
      args:
        executable: /bin/bash
      register: betleague_swarm_non_converged_diagnostics
      changed_when: false
      failed_when: false

    - name: Afficher le détail des services Swarm non convergés
      ansible.builtin.debug:
        msg:
          - "La stack {{ betleague_swarm_stack_name }} n'a pas convergé dans le délai imparti ({{ betleague_swarm_wait_timeout_seconds }}s)."
          - "Services:"
          - "{{ betleague_swarm_services_state.stdout | default('Aucune sortie docker stack services') }}"
          - "Tâches:"
          - "{{ betleague_swarm_tasks_state.stdout | default('Aucune sortie docker stack ps') }}"
          - "Diagnostics services non convergés:"
          - "{{ betleague_swarm_non_converged_diagnostics.stdout | default('Aucun diagnostic détaillé disponible') }}"

    - name: Échouer explicitement si la stack Swarm ne converge pas
      ansible.builtin.fail:
        msg: >-
          La stack {{ betleague_swarm_stack_name }} n'a pas convergé dans le délai imparti.
          Inspecte les sorties `docker stack services {{ betleague_swarm_stack_name }}` et
          `docker stack ps --no-trunc {{ betleague_swarm_stack_name }}` affichées juste avant pour identifier
          le service bloquant (image, healthcheck, crashloop, rollback ou dépendance indisponible).

- name: Vérifier la santé de l'API après déploiement
  ansible.builtin.uri:
    url: "{{ betleague_swarm_api_healthcheck_url }}"
    method: GET
    return_content: false
    status_code: 200
    validate_certs: "{{ not (betleague_letsencrypt_staging | default(false) | bool) }}"
  register: betleague_swarm_api_health
  retries: 12
  delay: 5
  until: betleague_swarm_api_health.status == 200
  delegate_to: localhost
  become: false

















