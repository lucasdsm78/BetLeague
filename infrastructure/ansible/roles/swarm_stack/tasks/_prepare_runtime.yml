---
- name: Vérifier les variables Swarm requises
  ansible.builtin.assert:
    that:
      - betleague_swarm_stack_name | trim != ''
      - betleague_swarm_backend_image | trim != ''
      - betleague_swarm_frontend_image | trim != ''
      - betleague_swarm_update_failure_action in ['pause', 'continue', 'rollback']
      - betleague_swarm_python_temp | trim is match('^/')
      - betleague_swarm_python_tmp | trim is match('^/')
      - betleague_swarm_app_domain | trim != ''
      - betleague_swarm_api_domain | trim != ''
      - betleague_swarm_backend_env_content | trim != ''
      - betleague_swarm_migrations_env_content | trim != ''
      - betleague_swarm_grafana_admin_password | trim != ''
      - betleague_swarm_grafana_secret_key | trim != ''
      - betleague_swarm_monitoring_htpasswd | trim != ''
      - not (betleague_swarm_internal_postgres_enabled | bool) or betleague_swarm_postgres_image | trim != ''
      - not (betleague_swarm_internal_postgres_enabled | bool) or betleague_swarm_postgres_service_name | trim != ''
      - not (betleague_swarm_internal_postgres_enabled | bool) or betleague_swarm_postgres_database | trim != ''
      - not (betleague_swarm_internal_postgres_enabled | bool) or betleague_swarm_postgres_superuser | trim != ''
      - not (betleague_swarm_internal_postgres_enabled | bool) or betleague_swarm_postgres_app_user | trim != ''
      - not (betleague_swarm_internal_postgres_enabled | bool) or betleague_swarm_postgres_migrations_user | trim != ''
      - not (betleague_swarm_internal_postgres_enabled | bool) or betleague_swarm_postgres_placement_constraint | trim != ''
      - not (betleague_swarm_internal_postgres_enabled | bool) or betleague_swarm_postgres_superuser_password | trim != ''
      - not (betleague_swarm_internal_postgres_enabled | bool) or betleague_swarm_postgres_app_password | trim != ''
      - not (betleague_swarm_internal_postgres_enabled | bool) or betleague_swarm_postgres_migrations_password | trim != ''
      - betleague_swarm_redis_password | trim != ''
      - betleague_swarm_nats_user | trim != ''
      - betleague_swarm_nats_password | trim != ''
      - betleague_swarm_nats_ca_cert | trim != ''
      - betleague_swarm_nats_server_cert | trim != ''
      - betleague_swarm_nats_server_key | trim != ''
      - betleague_swarm_nats_client_cert | trim != ''
      - betleague_swarm_nats_client_key | trim != ''
    fail_msg: Variables Swarm requises manquantes pour le déploiement de la stack.

- name: Normaliser les contenus d'environnement Swarm compatibles shell + docker --env-file
  ansible.builtin.set_fact:
    betleague_swarm_backend_env_content_normalized: >-
      {{
        betleague_swarm_backend_env_content
        | regex_replace('^\ufeff', '')
        | regex_replace('\r', '')
        | regex_replace('\n*$', '')
      }}
    betleague_swarm_migrations_env_content_normalized: >-
      {{
        betleague_swarm_migrations_env_content
        | regex_replace('^\ufeff', '')
        | regex_replace('\r', '')
        | regex_replace('\n*$', '')
      }}
    betleague_swarm_alertmanager_config_content_normalized: >-
      {{
        betleague_swarm_alertmanager_config_content
        | regex_replace('^\ufeff', '')
        | regex_replace('\r', '')
        | regex_replace('\n*$', '')
      }}

- name: Déterminer si Alertmanager est activé et calculer la configuration effective
  ansible.builtin.set_fact:
    betleague_swarm_alertmanager_enabled: "{{ betleague_swarm_alertmanager_config_content_normalized | trim != '' }}"
    betleague_swarm_alertmanager_config_content_effective: |
      {% if betleague_swarm_alertmanager_config_content_normalized | trim != '' %}
      {{ betleague_swarm_alertmanager_config_content_normalized }}
      {% else %}
      global:
        resolve_timeout: 5m

      route:
        receiver: null

      receivers:
        - name: null
      {% endif %}
  no_log: true

- name: Valider les paramètres de sécurité monitoring
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import ipaddress
        import re
        import sys

        require_allowlist = sys.argv[1].lower() == "true"
        raw_cidrs = sys.argv[2]
        htpasswd = sys.argv[3].strip()
        grafana_password = sys.argv[4]
        grafana_secret_key = sys.argv[5]
        scrape_interval = sys.argv[6]
        scrape_timeout = sys.argv[7]
        retention_time = sys.argv[8]
        retention_size = sys.argv[9]
        sample_limit = int(sys.argv[10])
        label_limit = int(sys.argv[11])

        errors = []

        def duration_seconds(value: str) -> float:
            match = re.match(r"^([1-9][0-9]*)(ms|s|m|h|d)$", value)
            if not match:
                raise ValueError(value)
            amount = int(match.group(1))
            unit = match.group(2)
            factors = {"ms": 0.001, "s": 1, "m": 60, "h": 3600, "d": 86400}
            return amount * factors[unit]

        cidrs = [item.strip() for item in raw_cidrs.replace("\r", "").replace("\n", ",").split(",") if item.strip()]
        if require_allowlist and not cidrs:
            errors.append("MONITORING_ALLOWLIST_CIDRS est requis quand betleague_swarm_require_monitoring_allowlist=true")
        for cidr in cidrs:
            try:
                ipaddress.ip_network(cidr, strict=False)
            except ValueError as exc:
                errors.append(f"CIDR monitoring invalide: {cidr} ({exc})")

        if not re.match(r"^[^:\s]+:\$2[aby]\$\d{2}\$[./A-Za-z0-9]{53}$", htpasswd):
            errors.append("MONITORING_HTPASSWD doit contenir une ligne htpasswd bcrypt, ex: htpasswd -nBC 12 monitoring")
        if len(grafana_password) < 24:
            errors.append("GRAFANA_ADMIN_PASSWORD doit faire au moins 24 caractères")
        if len(grafana_secret_key) < 32:
            errors.append("GRAFANA_SECRET_KEY doit faire au moins 32 caractères aléatoires")
        if not re.match(r"^[1-9][0-9]*(ms|s|m|h)$", scrape_interval):
            errors.append("PROMETHEUS_SCRAPE_INTERVAL invalide")
        if not re.match(r"^[1-9][0-9]*(ms|s|m|h)$", scrape_timeout):
            errors.append("PROMETHEUS_SCRAPE_TIMEOUT invalide")
        try:
            if duration_seconds(scrape_timeout) > duration_seconds(scrape_interval):
                errors.append("PROMETHEUS_SCRAPE_TIMEOUT doit être inférieur ou égal à PROMETHEUS_SCRAPE_INTERVAL")
        except ValueError:
            pass
        if not re.match(r"^[1-9][0-9]*(d|h|m)$", retention_time):
            errors.append("PROMETHEUS_RETENTION_TIME invalide")
        if not re.match(r"^[1-9][0-9]*(KB|MB|GB|TB|KiB|MiB|GiB|TiB|B)$", retention_size):
            errors.append("PROMETHEUS_RETENTION_SIZE invalide")
        if sample_limit < 100 or sample_limit > 10000:
            errors.append("betleague_swarm_prometheus_sample_limit doit être entre 100 et 10000")
        if label_limit < 10 or label_limit > 100:
            errors.append("betleague_swarm_prometheus_label_limit doit être entre 10 et 100")

        if errors:
            for error in errors:
                print(f"- {error}", file=sys.stderr)
            raise SystemExit(1)
      - "{{ betleague_swarm_require_monitoring_allowlist | bool | ternary('true', 'false') }}"
      - "{{ betleague_swarm_monitoring_allowlist_cidrs }}"
      - "{{ betleague_swarm_monitoring_htpasswd }}"
      - "{{ betleague_swarm_grafana_admin_password }}"
      - "{{ betleague_swarm_grafana_secret_key }}"
      - "{{ betleague_swarm_prometheus_scrape_interval }}"
      - "{{ betleague_swarm_prometheus_scrape_timeout }}"
      - "{{ betleague_swarm_prometheus_retention_time }}"
      - "{{ betleague_swarm_prometheus_retention_size }}"
      - "{{ betleague_swarm_prometheus_sample_limit | string }}"
      - "{{ betleague_swarm_prometheus_label_limit | string }}"
  changed_when: false
  no_log: true

- name: Valider les secrets PostgreSQL internes
  ansible.builtin.assert:
    that:
      - betleague_swarm_postgres_superuser_password | length >= 24
      - betleague_swarm_postgres_app_password | length >= 24
      - betleague_swarm_postgres_migrations_password | length >= 24
      - betleague_swarm_postgres_superuser_password != betleague_swarm_postgres_app_password
      - betleague_swarm_postgres_superuser_password != betleague_swarm_postgres_migrations_password
      - betleague_swarm_postgres_app_password != betleague_swarm_postgres_migrations_password
      - betleague_swarm_postgres_app_user != betleague_swarm_postgres_migrations_user
    fail_msg: >-
      Les secrets PostgreSQL internes doivent être robustes (>=24 caractères), distincts
      entre superuser / runtime / migrations, et les rôles applicatif / migrations doivent être séparés.
  when: betleague_swarm_internal_postgres_enabled | bool
  no_log: true

- name: Calculer les noms immuables des secrets Swarm depuis leur contenu
  ansible.builtin.set_fact:
    betleague_swarm_backend_env_secret_name: "{{ betleague_swarm_stack_name }}_backend_env_{{ ((betleague_swarm_backend_env_content_normalized ~ '\n') | hash('sha256'))[:12] }}"
    betleague_swarm_migrations_env_secret_name: "{{ betleague_swarm_stack_name }}_migrations_env_{{ ((betleague_swarm_migrations_env_content_normalized ~ '\n') | hash('sha256'))[:12] }}"
    betleague_swarm_grafana_admin_password_secret_name: "{{ betleague_swarm_stack_name }}_grafana_admin_password_{{ ((betleague_swarm_grafana_admin_password ~ '\n') | hash('sha256'))[:12] }}"
    betleague_swarm_grafana_secret_key_secret_name: "{{ betleague_swarm_stack_name }}_grafana_secret_key_{{ ((betleague_swarm_grafana_secret_key ~ '\n') | hash('sha256'))[:12] }}"
    betleague_swarm_monitoring_htpasswd_secret_name: "{{ betleague_swarm_stack_name }}_monitoring_htpasswd_{{ ((betleague_swarm_monitoring_htpasswd ~ '\n') | hash('sha256'))[:12] }}"
    betleague_swarm_alertmanager_config_secret_name: "{{ betleague_swarm_stack_name }}_alertmanager_config_{{ ((betleague_swarm_alertmanager_config_content_effective | regex_replace('\n*$', '') ~ '\n') | hash('sha256'))[:12] }}"
    betleague_swarm_postgres_superuser_password_secret_name: "{{ betleague_swarm_stack_name }}_postgres_superuser_password_{{ ((betleague_swarm_postgres_superuser_password ~ '\n') | hash('sha256'))[:12] }}"
    betleague_swarm_postgres_app_password_secret_name: "{{ betleague_swarm_stack_name }}_postgres_app_password_{{ ((betleague_swarm_postgres_app_password ~ '\n') | hash('sha256'))[:12] }}"
    betleague_swarm_postgres_migrations_password_secret_name: "{{ betleague_swarm_stack_name }}_postgres_migrations_password_{{ ((betleague_swarm_postgres_migrations_password ~ '\n') | hash('sha256'))[:12] }}"
    betleague_swarm_redis_password_secret_name: "{{ betleague_swarm_stack_name }}_redis_password_{{ ((betleague_swarm_redis_password ~ '\n') | hash('sha256'))[:12] }}"
    betleague_swarm_nats_user_secret_name: "{{ betleague_swarm_stack_name }}_nats_user_{{ ((betleague_swarm_nats_user ~ '\n') | hash('sha256'))[:12] }}"
    betleague_swarm_nats_password_secret_name: "{{ betleague_swarm_stack_name }}_nats_password_{{ ((betleague_swarm_nats_password ~ '\n') | hash('sha256'))[:12] }}"
    betleague_swarm_nats_ca_cert_secret_name: "{{ betleague_swarm_stack_name }}_nats_ca_cert_{{ ((betleague_swarm_nats_ca_cert ~ '\n') | hash('sha256'))[:12] }}"
    betleague_swarm_nats_server_cert_secret_name: "{{ betleague_swarm_stack_name }}_nats_server_cert_{{ ((betleague_swarm_nats_server_cert ~ '\n') | hash('sha256'))[:12] }}"
    betleague_swarm_nats_server_key_secret_name: "{{ betleague_swarm_stack_name }}_nats_server_key_{{ ((betleague_swarm_nats_server_key ~ '\n') | hash('sha256'))[:12] }}"
    betleague_swarm_nats_client_cert_secret_name: "{{ betleague_swarm_stack_name }}_nats_client_cert_{{ ((betleague_swarm_nats_client_cert ~ '\n') | hash('sha256'))[:12] }}"
    betleague_swarm_nats_client_key_secret_name: "{{ betleague_swarm_stack_name }}_nats_client_key_{{ ((betleague_swarm_nats_client_key ~ '\n') | hash('sha256'))[:12] }}"
  no_log: true

- name: Vérifier que backend.env et migrations.env utilisent une syntaxe KEY=value compatible
  ansible.builtin.set_fact:
    betleague_swarm_env_validation_results: >-
      {%- set ns = namespace(results=[]) -%}
      {%- for env_file in [
        {'name': 'backend.env', 'content': betleague_swarm_backend_env_content_normalized},
        {'name': 'migrations.env', 'content': betleague_swarm_migrations_env_content_normalized}
      ] -%}
      {%- set invalid = namespace(lines=[]) -%}
      {%- for line in env_file.content.split('\n') -%}
      {%- if line != '' and not (line is match('^#')) and not (line is match('^[A-Za-z_][A-Za-z0-9_]*=.*$')) -%}
      {%- set invalid.lines = invalid.lines + [loop.index] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set ns.results = ns.results + [{'name': env_file.name, 'invalid_line_numbers': invalid.lines}] -%}
      {%- endfor -%}
      {{ ns.results }}
  no_log: true

- name: Vérifier que backend.env et migrations.env utilisent une syntaxe KEY=value compatible
  ansible.builtin.assert:
    that:
      - item.invalid_line_numbers | length == 0
    fail_msg: >-
      Le fichier `{{ item.name }}` contient des lignes incompatibles avec le chargeur d'environnement BetLeague :
      {{ item.invalid_line_numbers | join(', ') }}.
      Utilise uniquement des lignes `KEY=value`, des commentaires commençant par `#` et des lignes vides.
      Les syntaxes `KEY = value`, `export KEY=value`, l'indentation en début de ligne et les valeurs multilignes réelles ne sont pas supportées.
      Pour les PEM/certificats, utilise une seule ligne avec des `\n` échappés.
  loop: "{{ betleague_swarm_env_validation_results }}"

- name: Vérifier que les URLs Redis et Celery de backend.env sont valides
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sys
        from urllib.parse import urlsplit

        env = {}
        for raw_line in sys.stdin.read().splitlines():
            if not raw_line or raw_line.startswith("#"):
                continue
            key, separator, value = raw_line.partition("=")
            if separator:
                env[key] = value

        required = ("REDIS_URL", "CELERY_BROKER_URL", "CELERY_RESULT_BACKEND")
        allowed_schemes = {"redis", "rediss"}
        errors = []
        for key in required:
            value = env.get(key, "").strip()
            if not value:
                errors.append(f"{key}: variable manquante ou vide")
                continue
            try:
                parts = urlsplit(value)
                port = parts.port
            except ValueError:
                errors.append(f"{key}: URL invalide ; percent-encode le mot de passe Redis dans l'URL")
                continue
            if parts.scheme not in allowed_schemes:
                errors.append(f"{key}: schéma invalide, attendu redis:// ou rediss://")
            if not parts.hostname:
                errors.append(f"{key}: hostname manquant")
            if port is None:
                errors.append(f"{key}: port explicite manquant")

        if errors:
            print("backend.env contient des URLs Redis/Celery invalides:", file=sys.stderr)
            for error in errors:
                print(f"- {error}", file=sys.stderr)
            raise SystemExit(1)
  args:
    stdin: "{{ betleague_swarm_backend_env_content_normalized }}"
  changed_when: false

- name: Créer l'arborescence de déploiement Swarm
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ betleague_runtime_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ betleague_swarm_deploy_path }}", mode: '0750' }
    - { path: "{{ betleague_swarm_deploy_path }}/generated", mode: '0750' }
    - { path: "{{ betleague_swarm_deploy_path }}/secrets", mode: '0750' }

- name: Déployer le manifest Swarm
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/swarm/stack.prod.yml"
    dest: "{{ betleague_swarm_deploy_path }}/stack.prod.yml"
    owner: root
    group: "{{ betleague_runtime_group }}"
    mode: '0640'

- name: Déployer le template Redis
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../redis/redis.conf.template"
    dest: "{{ betleague_swarm_deploy_path }}/redis.conf.template"
    owner: root
    group: "{{ betleague_runtime_group }}"
    mode: '0440'

- name: Déployer la configuration NATS
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../back/nats/nats-server.conf"
    dest: "{{ betleague_swarm_deploy_path }}/nats-server.conf"
    owner: root
    group: "{{ betleague_runtime_group }}"
    mode: '0440'

- name: Rendre le script d'initialisation PostgreSQL interne
  ansible.builtin.template:
    src: postgres-init-betleague.sh.j2
    dest: "{{ betleague_swarm_deploy_path }}/generated/postgres-init-betleague.sh"
    owner: root
    group: "{{ betleague_runtime_group }}"
    mode: '0440'

- name: Rendre la configuration edge Nginx
  ansible.builtin.template:
    src: edge.conf.j2
    dest: "{{ betleague_swarm_deploy_path }}/generated/edge.conf"
    owner: root
    group: "{{ betleague_runtime_group }}"
    mode: '0440'

- name: Rendre la configuration Prometheus
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ betleague_swarm_deploy_path }}/generated/prometheus.yml"
    owner: root
    group: "{{ betleague_runtime_group }}"
    mode: '0440'

- name: Rendre les règles d'alertes Prometheus
  ansible.builtin.template:
    src: prometheus-alerts.yml.j2
    dest: "{{ betleague_swarm_deploy_path }}/generated/prometheus-alerts.yml"
    owner: root
    group: "{{ betleague_runtime_group }}"
    mode: '0440'

- name: Rendre la datasource Grafana provisionnée
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: "{{ betleague_swarm_deploy_path }}/generated/grafana-datasources.yml"
    owner: root
    group: "{{ betleague_runtime_group }}"
    mode: '0440'

- name: Rendre le provider de dashboards Grafana
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: "{{ betleague_swarm_deploy_path }}/generated/grafana-dashboards.yml"
    owner: root
    group: "{{ betleague_runtime_group }}"
    mode: '0440'

- name: Rendre le dashboard système Grafana
  ansible.builtin.template:
    src: grafana-dashboard-system-overview.json.j2
    dest: "{{ betleague_swarm_deploy_path }}/generated/grafana-dashboard-system-overview.json"
    owner: root
    group: "{{ betleague_runtime_group }}"
    mode: '0440'

- name: Rendre le dashboard Grafana des ligues overdue
  ansible.builtin.template:
    src: grafana-dashboard-league-payout-overdue.json.j2
    dest: "{{ betleague_swarm_deploy_path }}/generated/grafana-dashboard-league-payout-overdue.json"
    owner: root
    group: "{{ betleague_runtime_group }}"
    mode: '0440'

- name: Calculer les checksums des configs Swarm immuables
  ansible.builtin.stat:
    path: "{{ item.path }}"
    checksum_algorithm: sha256
  loop:
    - { key: 'edge_nginx_conf', path: "{{ betleague_swarm_deploy_path }}/generated/edge.conf" }
    - { key: 'redis_conf_template', path: "{{ betleague_swarm_deploy_path }}/redis.conf.template" }
    - { key: 'nats_server_conf', path: "{{ betleague_swarm_deploy_path }}/nats-server.conf" }
    - { key: 'postgres_init_betleague', path: "{{ betleague_swarm_deploy_path }}/generated/postgres-init-betleague.sh" }
    - { key: 'prometheus_conf', path: "{{ betleague_swarm_deploy_path }}/generated/prometheus.yml" }
    - { key: 'prometheus_alerts', path: "{{ betleague_swarm_deploy_path }}/generated/prometheus-alerts.yml" }
    - { key: 'grafana_datasources', path: "{{ betleague_swarm_deploy_path }}/generated/grafana-datasources.yml" }
    - { key: 'grafana_dashboards', path: "{{ betleague_swarm_deploy_path }}/generated/grafana-dashboards.yml" }
    - { key: 'grafana_system_overview_dashboard', path: "{{ betleague_swarm_deploy_path }}/generated/grafana-dashboard-system-overview.json" }
    - { key: 'grafana_league_payout_overdue_dashboard', path: "{{ betleague_swarm_deploy_path }}/generated/grafana-dashboard-league-payout-overdue.json" }
  loop_control:
    label: "{{ item.key }}"
  register: betleague_swarm_config_stats

- name: Calculer les noms immuables des configs Swarm depuis leur contenu
  ansible.builtin.set_fact:
    betleague_swarm_edge_nginx_conf_config_name: "{{ betleague_swarm_stack_name }}_edge_nginx_conf_{{ (betleague_swarm_config_stats.results | selectattr('item.key', 'equalto', 'edge_nginx_conf') | first).stat.checksum[:12] }}"
    betleague_swarm_redis_conf_template_config_name: "{{ betleague_swarm_stack_name }}_redis_conf_template_{{ (betleague_swarm_config_stats.results | selectattr('item.key', 'equalto', 'redis_conf_template') | first).stat.checksum[:12] }}"
    betleague_swarm_nats_server_conf_config_name: "{{ betleague_swarm_stack_name }}_nats_server_conf_{{ (betleague_swarm_config_stats.results | selectattr('item.key', 'equalto', 'nats_server_conf') | first).stat.checksum[:12] }}"
    betleague_swarm_postgres_init_betleague_config_name: "{{ betleague_swarm_stack_name }}_postgres_init_betleague_{{ (betleague_swarm_config_stats.results | selectattr('item.key', 'equalto', 'postgres_init_betleague') | first).stat.checksum[:12] }}"
    betleague_swarm_prometheus_conf_config_name: "{{ betleague_swarm_stack_name }}_prometheus_conf_{{ (betleague_swarm_config_stats.results | selectattr('item.key', 'equalto', 'prometheus_conf') | first).stat.checksum[:12] }}"
    betleague_swarm_prometheus_alerts_config_name: "{{ betleague_swarm_stack_name }}_prometheus_alerts_{{ (betleague_swarm_config_stats.results | selectattr('item.key', 'equalto', 'prometheus_alerts') | first).stat.checksum[:12] }}"
    betleague_swarm_grafana_datasources_config_name: "{{ betleague_swarm_stack_name }}_grafana_datasources_{{ (betleague_swarm_config_stats.results | selectattr('item.key', 'equalto', 'grafana_datasources') | first).stat.checksum[:12] }}"
    betleague_swarm_grafana_dashboards_config_name: "{{ betleague_swarm_stack_name }}_grafana_dashboards_{{ (betleague_swarm_config_stats.results | selectattr('item.key', 'equalto', 'grafana_dashboards') | first).stat.checksum[:12] }}"
    betleague_swarm_grafana_system_overview_dashboard_config_name: "{{ betleague_swarm_stack_name }}_grafana_system_overview_dashboard_{{ (betleague_swarm_config_stats.results | selectattr('item.key', 'equalto', 'grafana_system_overview_dashboard') | first).stat.checksum[:12] }}"
    betleague_swarm_grafana_league_payout_overdue_dashboard_config_name: "{{ betleague_swarm_stack_name }}_grafana_league_payout_overdue_dashboard_{{ (betleague_swarm_config_stats.results | selectattr('item.key', 'equalto', 'grafana_league_payout_overdue_dashboard') | first).stat.checksum[:12] }}"

- name: Déployer les secrets de stack Swarm
  ansible.builtin.copy:
    content: "{{ item.content }}\n"
    dest: "{{ betleague_swarm_deploy_path }}/secrets/{{ item.name }}"
    owner: root
    group: root
    mode: '0600'
  loop:
    - { name: 'backend.env', content: "{{ betleague_swarm_backend_env_content_normalized }}" }
    - { name: 'migrations.env', content: "{{ betleague_swarm_migrations_env_content_normalized }}" }
    - { name: 'grafana_admin_password.txt', content: "{{ betleague_swarm_grafana_admin_password }}" }
    - { name: 'grafana_secret_key.txt', content: "{{ betleague_swarm_grafana_secret_key }}" }
    - { name: 'monitoring_htpasswd', content: "{{ betleague_swarm_monitoring_htpasswd }}" }
    - { name: 'alertmanager.yml', content: "{{ betleague_swarm_alertmanager_config_content_effective | regex_replace('\n*$', '') }}" }
    - { name: 'postgres_superuser_password.txt', content: "{{ betleague_swarm_postgres_superuser_password }}" }
    - { name: 'postgres_app_password.txt', content: "{{ betleague_swarm_postgres_app_password }}" }
    - { name: 'postgres_migrations_password.txt', content: "{{ betleague_swarm_postgres_migrations_password }}" }
    - { name: 'redis_password.txt', content: "{{ betleague_swarm_redis_password }}" }
    - { name: 'nats_user.txt', content: "{{ betleague_swarm_nats_user }}" }
    - { name: 'nats_password.txt', content: "{{ betleague_swarm_nats_password }}" }
    - { name: 'nats-ca-cert.pem', content: "{{ betleague_swarm_nats_ca_cert }}" }
    - { name: 'nats-server-cert.pem', content: "{{ betleague_swarm_nats_server_cert }}" }
    - { name: 'nats-server-key.pem', content: "{{ betleague_swarm_nats_server_key }}" }
    - { name: 'nats-client-cert.pem', content: "{{ betleague_swarm_nats_client_cert }}" }
    - { name: 'nats-client-key.pem', content: "{{ betleague_swarm_nats_client_key }}" }
  no_log: true

- name: Connecter le noeud au registre privé si configuré
  ansible.builtin.shell: |
    set -euo pipefail
    printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_SERVER" --username "$REGISTRY_USERNAME" --password-stdin >/dev/null
  args:
    executable: /bin/bash
  environment:
    REGISTRY_SERVER: "{{ betleague_swarm_registry_server }}"
    REGISTRY_USERNAME: "{{ betleague_swarm_registry_username }}"
    REGISTRY_PASSWORD: "{{ betleague_swarm_registry_password }}"
  when:
    - betleague_swarm_registry_server | trim != ''
    - betleague_swarm_registry_username | trim != ''
    - betleague_swarm_registry_password | trim != ''
  no_log: true

- name: Vérifier que l'image backend cible existe
  ansible.builtin.command: docker manifest inspect {{ betleague_swarm_backend_image }}
  register: betleague_swarm_backend_manifest
  changed_when: false

- name: Vérifier que l'image frontend cible existe
  ansible.builtin.command: docker manifest inspect {{ betleague_swarm_frontend_image }}
  register: betleague_swarm_frontend_manifest
  changed_when: false

- name: Précharger l'image backend cible
  ansible.builtin.command: docker pull {{ betleague_swarm_backend_image }}
  register: betleague_swarm_backend_pull
  changed_when: >-
    'Downloaded newer image' in betleague_swarm_backend_pull.stdout or
    'Status: Downloaded newer image' in betleague_swarm_backend_pull.stdout

- name: Précharger l'image frontend cible
  ansible.builtin.command: docker pull {{ betleague_swarm_frontend_image }}
  register: betleague_swarm_frontend_pull
  changed_when: >-
    'Downloaded newer image' in betleague_swarm_frontend_pull.stdout or
    'Status: Downloaded newer image' in betleague_swarm_frontend_pull.stdout






