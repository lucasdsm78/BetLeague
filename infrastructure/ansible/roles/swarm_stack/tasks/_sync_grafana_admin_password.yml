---
- name: Identifier le conteneur Grafana actif
  ansible.builtin.shell: |
    set -euo pipefail
    docker ps \
      --filter "label=com.docker.swarm.service.name={{ betleague_swarm_stack_name }}_grafana" \
      --filter status=running \
      --format '{{"{{.ID}}"}}' \
      | head -n 1
  args:
    executable: /bin/bash
  register: betleague_swarm_grafana_container_id
  retries: "{{ (betleague_swarm_wait_timeout_seconds // betleague_swarm_wait_sleep_seconds) | int }}"
  delay: "{{ betleague_swarm_wait_sleep_seconds }}"
  until: betleague_swarm_grafana_container_id.stdout | trim != ''
  changed_when: false
  when: betleague_swarm_grafana_sync_admin_password | bool

- name: Synchroniser le mot de passe admin Grafana depuis la CI
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec \
      -e BETLEAGUE_GRAFANA_ADMIN_PASSWORD="$BETLEAGUE_GRAFANA_ADMIN_PASSWORD" \
      {{ betleague_swarm_grafana_container_id.stdout | trim }} \
      sh -ceu '
        grafana cli \
          --homepath /usr/share/grafana \
          --config /etc/grafana/grafana.ini \
          admin reset-admin-password "$BETLEAGUE_GRAFANA_ADMIN_PASSWORD" >/dev/null
      '
  args:
    executable: /bin/bash
  environment:
    BETLEAGUE_GRAFANA_ADMIN_PASSWORD: "{{ betleague_swarm_grafana_admin_password }}"
  changed_when: true
  no_log: true
  when: betleague_swarm_grafana_sync_admin_password | bool

- name: Vérifier l'authentification admin Grafana après synchronisation
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec \
      -e BETLEAGUE_GRAFANA_ADMIN_USER="$BETLEAGUE_GRAFANA_ADMIN_USER" \
      -e BETLEAGUE_GRAFANA_ADMIN_PASSWORD="$BETLEAGUE_GRAFANA_ADMIN_PASSWORD" \
      {{ betleague_swarm_grafana_container_id.stdout | trim }} \
      sh -ceu '
        wget -q -O - \
          --user "$BETLEAGUE_GRAFANA_ADMIN_USER" \
          --password "$BETLEAGUE_GRAFANA_ADMIN_PASSWORD" \
          http://127.0.0.1:3000/api/user \
          | grep -Eq "\"login\"[[:space:]]*:[[:space:]]*\"$BETLEAGUE_GRAFANA_ADMIN_USER\""
      '
  args:
    executable: /bin/bash
  environment:
    BETLEAGUE_GRAFANA_ADMIN_USER: "{{ betleague_swarm_grafana_admin_user }}"
    BETLEAGUE_GRAFANA_ADMIN_PASSWORD: "{{ betleague_swarm_grafana_admin_password }}"
  register: betleague_swarm_grafana_admin_auth_check
  retries: 12
  delay: 5
  until: betleague_swarm_grafana_admin_auth_check.rc == 0
  changed_when: false
  failed_when: false
  no_log: true
  when: betleague_swarm_grafana_sync_admin_password | bool

- name: Diagnostiquer Grafana sans secret après échec d'authentification admin
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec {{ betleague_swarm_grafana_container_id.stdout | trim }} sh -ceu '
      printf "=== grafana health ===\n"
      wget -q -O - http://127.0.0.1:3000/api/health || true
      printf "\n=== grafana process ===\n"
      ps | grep -E "[g]rafana" || true
      printf "\n=== grafana paths ===\n"
      ls -ld /var/lib/grafana /etc/grafana /usr/share/grafana 2>/dev/null || true
    '
  args:
    executable: /bin/bash
  register: betleague_swarm_grafana_auth_failure_diagnostics
  changed_when: false
  failed_when: false
  when:
    - betleague_swarm_grafana_sync_admin_password | bool
    - betleague_swarm_grafana_admin_auth_check.rc != 0

- name: Échouer si l'authentification admin Grafana reste invalide
  ansible.builtin.fail:
    msg: >-
      Grafana répond, mais l'authentification `{{ betleague_swarm_grafana_admin_user }}` avec
      `GRAFANA_ADMIN_PASSWORD` reste invalide après `grafana cli admin reset-admin-password`.
      Diagnostics non secrets: {{ betleague_swarm_grafana_auth_failure_diagnostics.stdout | default('indisponible') }}.
      Causes probables: login admin historique différent dans le volume `grafana_data`, reset CLI ciblant
      un autre utilisateur admin, ou Basic Auth/login form désactivé dans la configuration effective.
  when:
    - betleague_swarm_grafana_sync_admin_password | bool
    - betleague_swarm_grafana_admin_auth_check.rc != 0

- name: Vérifier la disponibilité des plugins core Grafana
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec \
      -e BETLEAGUE_GRAFANA_ADMIN_USER="$BETLEAGUE_GRAFANA_ADMIN_USER" \
      -e BETLEAGUE_GRAFANA_ADMIN_PASSWORD="$BETLEAGUE_GRAFANA_ADMIN_PASSWORD" \
      {{ betleague_swarm_grafana_container_id.stdout | trim }} \
      sh -ceu '
        auth="$(printf "%s:%s" "$BETLEAGUE_GRAFANA_ADMIN_USER" "$BETLEAGUE_GRAFANA_ADMIN_PASSWORD" | base64 | tr -d "\n")"
        for plugin_id in stat timeseries; do
          wget -q -O - \
            --header "Authorization: Basic $auth" \
            "http://127.0.0.1:3000/api/plugins/${plugin_id}/settings" \
            | grep -Eq "\"id\"[[:space:]]*:[[:space:]]*\"${plugin_id}\""
        done
      '
  args:
    executable: /bin/bash
  environment:
    BETLEAGUE_GRAFANA_ADMIN_USER: "{{ betleague_swarm_grafana_admin_user }}"
    BETLEAGUE_GRAFANA_ADMIN_PASSWORD: "{{ betleague_swarm_grafana_admin_password }}"
  register: betleague_swarm_grafana_core_plugins_check
  retries: 12
  delay: 5
  until: betleague_swarm_grafana_core_plugins_check.rc == 0
  changed_when: false
  failed_when: false
  no_log: true
  when: betleague_swarm_grafana_sync_admin_password | bool

- name: Échouer si les plugins core Grafana ne sont pas exposés par l'API
  ansible.builtin.fail:
    msg: >-
      Les plugins core Grafana `stat` et/ou `timeseries` ne sont pas exposés par l'API interne.
      Vérifie les logs `{{ betleague_swarm_stack_name }}_grafana`, le volume `grafana_data`, et le chargement
      des assets frontend après mise à jour complète de la stack.
  when:
    - betleague_swarm_grafana_sync_admin_password | bool
    - betleague_swarm_grafana_core_plugins_check.rc != 0
