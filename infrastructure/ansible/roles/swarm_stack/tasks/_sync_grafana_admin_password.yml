---
- name: Identifier le conteneur Grafana actif
  ansible.builtin.shell: |
    set -euo pipefail
    docker ps \
      --filter "label=com.docker.swarm.service.name={{ betleague_swarm_stack_name }}_grafana" \
      --filter status=running \
      --format {% raw %}'{{.ID}}'{% endraw %} \
      | head -n 1
  args:
    executable: /bin/bash
  register: betleague_swarm_grafana_container_id
  retries: "{{ (betleague_swarm_wait_timeout_seconds // betleague_swarm_wait_sleep_seconds) | int }}"
  delay: "{{ betleague_swarm_wait_sleep_seconds }}"
  until: betleague_swarm_grafana_container_id.stdout | trim != ''
  changed_when: false
  when: betleague_swarm_grafana_sync_admin_password | bool

- name: Identifier le volume de données Grafana
  ansible.builtin.command: >-
    docker inspect {{ betleague_swarm_grafana_container_id.stdout | trim | quote }}
    --format {% raw %}'{{range .Mounts}}{{if and (eq .Destination "/var/lib/grafana") (eq .Type "volume")}}{{println .Name}}{{end}}{{end}}'{% endraw %}
  register: betleague_swarm_grafana_data_volume
  changed_when: false
  when: betleague_swarm_grafana_sync_admin_password | bool

- name: Vérifier que le volume de données Grafana est identifié
  ansible.builtin.assert:
    that:
      - (betleague_swarm_grafana_data_volume.stdout_lines | select('truthy') | list | length) == 1
    fail_msg: >-
      Impossible d'identifier de manière unique le volume Docker monté sur `/var/lib/grafana`
      par le conteneur Grafana `{{ betleague_swarm_grafana_container_id.stdout | trim }}`.
      Volumes observés: {{ betleague_swarm_grafana_data_volume.stdout_lines | default([]) | join(', ') }}.
  when: betleague_swarm_grafana_sync_admin_password | bool

- name: Normaliser le compte admin Grafana persistant
  ansible.builtin.shell: |
    set -euo pipefail
    docker run --rm \
      --user 0:0 \
      --mount source={{ betleague_swarm_grafana_data_volume.stdout | trim | quote }},target=/var/lib/grafana \
      {{ betleague_swarm_grafana_sqlite_helper_image | quote }} \
      python - <<'PY'
    import sqlite3
    import os
    from pathlib import Path

    db_path = Path('/var/lib/grafana/grafana.db')
    if not db_path.exists():
        raise SystemExit('grafana.db introuvable dans /var/lib/grafana')

    con = sqlite3.connect(str(db_path), timeout=30)
    con.execute('PRAGMA busy_timeout=30000')
    cur = con.cursor()

    admin_login = 'admin'
    row = cur.execute(
        "select id from user where login = ? and coalesce(is_service_account, 0) = 0 order by id limit 1",
        (admin_login,),
    ).fetchone()
    if row is None:
        row = cur.execute(
            "select id from user where coalesce(is_admin, 0) = 1 and coalesce(is_service_account, 0) = 0 order by id limit 1"
        ).fetchone()
    if row is None:
        row = cur.execute(
            "select id from user where coalesce(is_service_account, 0) = 0 order by id limit 1"
        ).fetchone()
    if row is None:
        raise SystemExit('aucun utilisateur Grafana normalisable trouvé')

    user_id = int(row[0])
    cur.execute(
        "update user set login = 'admin-conflict-' || id where login = ? and id != ?",
        (admin_login, user_id),
    )
    cur.execute(
        "update user set login = ?, name = ?, is_admin = 1, is_disabled = 0 where id = ?",
        (admin_login, admin_login, user_id),
    )

    org_row = cur.execute("select 1 from org_user where org_id = 1 and user_id = ?", (user_id,)).fetchone()
    if org_row:
        cur.execute("update org_user set role = 'Admin' where org_id = 1 and user_id = ?", (user_id,))
    else:
        columns = [item[1] for item in cur.execute("pragma table_info(org_user)").fetchall()]
        values = {
            'org_id': 1,
            'user_id': user_id,
            'role': 'Admin',
            'created': '1970-01-01 00:00:00',
            'updated': '1970-01-01 00:00:00',
        }
        insert_columns = [column for column in columns if column in values]
        placeholders = ','.join(['?'] * len(insert_columns))
        cur.execute(
            f"insert into org_user ({','.join(insert_columns)}) values ({placeholders})",
            [values[column] for column in insert_columns],
        )

    con.commit()
    con.close()
    for candidate in db_path.parent.glob('grafana.db*'):
        try:
            candidate.chmod(0o640)
            os.chown(candidate, 472, 0)
        except PermissionError:
            pass
    print(user_id)
    PY
  args:
    executable: /bin/bash
  register: betleague_swarm_grafana_admin_user_id
  changed_when: true
  when: betleague_swarm_grafana_sync_admin_password | bool

- name: Synchroniser le mot de passe admin Grafana depuis la CI
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec \
      -e BETLEAGUE_GRAFANA_ADMIN_PASSWORD="$BETLEAGUE_GRAFANA_ADMIN_PASSWORD" \
      -e BETLEAGUE_GRAFANA_ADMIN_USER_ID="{{ betleague_swarm_grafana_admin_user_id.stdout | trim }}" \
      {{ betleague_swarm_grafana_container_id.stdout | trim | quote }} \
      sh -ceu '
        test -n "$BETLEAGUE_GRAFANA_ADMIN_USER_ID"
        test -n "$BETLEAGUE_GRAFANA_ADMIN_PASSWORD"
        reset_with_grafana_cli() {
          grafana cli \
            --homepath /usr/share/grafana \
            --config /etc/grafana/grafana.ini \
            admin reset-admin-password --user-id "$BETLEAGUE_GRAFANA_ADMIN_USER_ID" "$BETLEAGUE_GRAFANA_ADMIN_PASSWORD" >/dev/null
        }
        reset_with_grafana_cli_alt_order() {
          grafana cli \
            --homepath /usr/share/grafana \
            --config /etc/grafana/grafana.ini \
            admin reset-admin-password "$BETLEAGUE_GRAFANA_ADMIN_PASSWORD" --user-id "$BETLEAGUE_GRAFANA_ADMIN_USER_ID" >/dev/null
        }
        reset_with_legacy_grafana_cli() {
          command -v grafana-cli >/dev/null 2>&1 || return 1
          grafana-cli \
            --homepath /usr/share/grafana \
            --config /etc/grafana/grafana.ini \
            admin reset-admin-password --user-id "$BETLEAGUE_GRAFANA_ADMIN_USER_ID" "$BETLEAGUE_GRAFANA_ADMIN_PASSWORD" >/dev/null
        }
        reset_with_grafana_cli || reset_with_grafana_cli_alt_order || reset_with_legacy_grafana_cli
      '
  args:
    executable: /bin/bash
  environment:
    BETLEAGUE_GRAFANA_ADMIN_PASSWORD: "{{ betleague_swarm_grafana_admin_password }}"
  register: betleague_swarm_grafana_admin_password_sync
  retries: 12
  delay: 5
  until: betleague_swarm_grafana_admin_password_sync.rc == 0
  changed_when: true
  failed_when: false
  no_log: true
  when: betleague_swarm_grafana_sync_admin_password | bool

- name: Diagnostiquer Grafana sans secret après échec de synchronisation du mot de passe admin
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec {{ betleague_swarm_grafana_container_id.stdout | trim | quote }} sh -ceu '
      printf "=== grafana health ===\n"
      wget -q -O - http://127.0.0.1:3000/api/health || true

      printf "\n=== grafana version ===\n"
      grafana -v || true

      printf "\n=== grafana cli reset help ===\n"
      grafana cli --homepath /usr/share/grafana --config /etc/grafana/grafana.ini admin reset-admin-password --help 2>&1 | head -n 80 || true

      printf "\n=== grafana-cli legacy availability ===\n"
      command -v grafana-cli || true

      printf "\n=== grafana db files ===\n"
      ls -l /var/lib/grafana/grafana.db* 2>/dev/null || true

      printf "\n=== grafana process ===\n"
      ps | grep -E "[g]rafana" || true
    '
    printf '\n=== normalized admin user id ===\n%s\n' {{ betleague_swarm_grafana_admin_user_id.stdout | trim | quote }}
  args:
    executable: /bin/bash
  register: betleague_swarm_grafana_password_sync_failure_diagnostics
  changed_when: false
  failed_when: false
  when:
    - betleague_swarm_grafana_sync_admin_password | bool
    - betleague_swarm_grafana_admin_password_sync.rc != 0

- name: Échouer si la synchronisation du mot de passe admin Grafana échoue
  ansible.builtin.fail:
    msg: >-
      La commande `grafana cli admin reset-admin-password` a échoué après plusieurs tentatives,
      sans exposer `GRAFANA_ADMIN_PASSWORD`. Diagnostics non secrets:
      {{ betleague_swarm_grafana_password_sync_failure_diagnostics.stdout | default('indisponible') }}.
      Causes probables: base SQLite verrouillée, permissions de `/var/lib/grafana/grafana.db*`,
      syntaxe CLI différente dans l'image Grafana, ou volume Grafana corrompu.
  when:
    - betleague_swarm_grafana_sync_admin_password | bool
    - betleague_swarm_grafana_admin_password_sync.rc != 0

- name: Vérifier l'authentification admin Grafana après synchronisation
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec \
      -e BETLEAGUE_GRAFANA_ADMIN_USER="$BETLEAGUE_GRAFANA_ADMIN_USER" \
      -e BETLEAGUE_GRAFANA_ADMIN_PASSWORD="$BETLEAGUE_GRAFANA_ADMIN_PASSWORD" \
      {{ betleague_swarm_grafana_container_id.stdout | trim | quote }} \
      sh -ceu '
        wget -q -O - \
          --user "$BETLEAGUE_GRAFANA_ADMIN_USER" \
          --password "$BETLEAGUE_GRAFANA_ADMIN_PASSWORD" \
          http://127.0.0.1:3000/api/user \
          | grep -Eq "\"login\"[[:space:]]*:[[:space:]]*\"$BETLEAGUE_GRAFANA_ADMIN_USER\""
      '
  args:
    executable: /bin/bash
  environment:
    BETLEAGUE_GRAFANA_ADMIN_USER: "{{ betleague_swarm_grafana_admin_user }}"
    BETLEAGUE_GRAFANA_ADMIN_PASSWORD: "{{ betleague_swarm_grafana_admin_password }}"
  register: betleague_swarm_grafana_admin_auth_check
  retries: 12
  delay: 5
  until: betleague_swarm_grafana_admin_auth_check.rc == 0
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - betleague_swarm_grafana_sync_admin_password | bool
    - betleague_swarm_grafana_admin_password_sync.rc == 0

- name: Diagnostiquer Grafana sans secret après échec d'authentification admin
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec {{ betleague_swarm_grafana_container_id.stdout | trim | quote }} sh -ceu '
      printf "=== grafana health ===\n"
      wget -q -O - http://127.0.0.1:3000/api/health || true
      printf "\n=== grafana process ===\n"
      ps | grep -E "[g]rafana" || true
      printf "\n=== grafana paths ===\n"
      ls -ld /var/lib/grafana /etc/grafana /usr/share/grafana 2>/dev/null || true
    '
  args:
    executable: /bin/bash
  register: betleague_swarm_grafana_auth_failure_diagnostics
  changed_when: false
  failed_when: false
  when:
    - betleague_swarm_grafana_sync_admin_password | bool
    - betleague_swarm_grafana_admin_password_sync.rc == 0
    - betleague_swarm_grafana_admin_auth_check.rc != 0

- name: Échouer si l'authentification admin Grafana reste invalide
  ansible.builtin.fail:
    msg: >-
      Grafana répond, mais l'authentification `{{ betleague_swarm_grafana_admin_user }}` avec
      `GRAFANA_ADMIN_PASSWORD` reste invalide après `grafana cli admin reset-admin-password`.
      Diagnostics non secrets: {{ betleague_swarm_grafana_auth_failure_diagnostics.stdout | default('indisponible') }}.
      Causes probables: login admin historique différent dans le volume `grafana_data`, reset CLI ciblant
      un autre utilisateur admin, ou Basic Auth/login form désactivé dans la configuration effective.
  when:
    - betleague_swarm_grafana_sync_admin_password | bool
    - betleague_swarm_grafana_admin_password_sync.rc == 0
    - betleague_swarm_grafana_admin_auth_check.rc != 0

- name: Vérifier la datasource Prometheus provisionnée dans Grafana
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec \
      -e BETLEAGUE_GRAFANA_ADMIN_USER="$BETLEAGUE_GRAFANA_ADMIN_USER" \
      -e BETLEAGUE_GRAFANA_ADMIN_PASSWORD="$BETLEAGUE_GRAFANA_ADMIN_PASSWORD" \
      {{ betleague_swarm_grafana_container_id.stdout | trim | quote }} \
      sh -ceu '
        auth="$(printf "%s:%s" "$BETLEAGUE_GRAFANA_ADMIN_USER" "$BETLEAGUE_GRAFANA_ADMIN_PASSWORD" | base64 | tr -d "\n")"
        wget -q -O - \
          --header "Authorization: Basic $auth" \
          http://127.0.0.1:3000/api/datasources/uid/betleague-prometheus \
          | grep -Eq "\"uid\"[[:space:]]*:[[:space:]]*\"betleague-prometheus\""
      '
  args:
    executable: /bin/bash
  environment:
    BETLEAGUE_GRAFANA_ADMIN_USER: "{{ betleague_swarm_grafana_admin_user }}"
    BETLEAGUE_GRAFANA_ADMIN_PASSWORD: "{{ betleague_swarm_grafana_admin_password }}"
  register: betleague_swarm_grafana_prometheus_datasource_check
  retries: 12
  delay: 5
  until: betleague_swarm_grafana_prometheus_datasource_check.rc == 0
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - betleague_swarm_grafana_sync_admin_password | bool
    - betleague_swarm_grafana_admin_password_sync.rc == 0
    - betleague_swarm_grafana_admin_auth_check.rc == 0

- name: Échouer si la datasource Prometheus Grafana est absente
  ansible.builtin.fail:
    msg: >-
      La datasource Grafana `betleague-prometheus` n'est pas visible via l'API après provisioning.
      Vérifie que le service `{{ betleague_swarm_stack_name }}_grafana` monte bien la config
      `{{ betleague_swarm_grafana_datasources_config_name }}` et que les logs Grafana ne signalent pas
      d'erreur de provisioning datasource.
  when:
    - betleague_swarm_grafana_sync_admin_password | bool
    - betleague_swarm_grafana_admin_password_sync.rc == 0
    - betleague_swarm_grafana_admin_auth_check.rc == 0
    - betleague_swarm_grafana_prometheus_datasource_check.rc != 0

- name: Vérifier la disponibilité des plugins core Grafana
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec \
      -e BETLEAGUE_GRAFANA_ADMIN_USER="$BETLEAGUE_GRAFANA_ADMIN_USER" \
      -e BETLEAGUE_GRAFANA_ADMIN_PASSWORD="$BETLEAGUE_GRAFANA_ADMIN_PASSWORD" \
      {{ betleague_swarm_grafana_container_id.stdout | trim | quote }} \
      sh -ceu '
        auth="$(printf "%s:%s" "$BETLEAGUE_GRAFANA_ADMIN_USER" "$BETLEAGUE_GRAFANA_ADMIN_PASSWORD" | base64 | tr -d "\n")"
        for plugin_id in stat timeseries; do
          wget -q -O - \
            --header "Authorization: Basic $auth" \
            "http://127.0.0.1:3000/api/plugins/${plugin_id}/settings" \
            | grep -Eq "\"id\"[[:space:]]*:[[:space:]]*\"${plugin_id}\""
        done
      '
  args:
    executable: /bin/bash
  environment:
    BETLEAGUE_GRAFANA_ADMIN_USER: "{{ betleague_swarm_grafana_admin_user }}"
    BETLEAGUE_GRAFANA_ADMIN_PASSWORD: "{{ betleague_swarm_grafana_admin_password }}"
  register: betleague_swarm_grafana_core_plugins_check
  retries: 12
  delay: 5
  until: betleague_swarm_grafana_core_plugins_check.rc == 0
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - betleague_swarm_grafana_sync_admin_password | bool
    - betleague_swarm_grafana_admin_password_sync.rc == 0
    - betleague_swarm_grafana_admin_auth_check.rc == 0

- name: Échouer si les plugins core Grafana ne sont pas exposés par l'API
  ansible.builtin.fail:
    msg: >-
      Les plugins core Grafana `stat` et/ou `timeseries` ne sont pas exposés par l'API interne.
      Vérifie les logs `{{ betleague_swarm_stack_name }}_grafana`, le volume `grafana_data`, et le chargement
      des assets frontend après mise à jour complète de la stack.
  when:
    - betleague_swarm_grafana_sync_admin_password | bool
    - betleague_swarm_grafana_admin_password_sync.rc == 0
    - betleague_swarm_grafana_admin_auth_check.rc == 0
    - betleague_swarm_grafana_core_plugins_check.rc != 0


