---
betleague_swarm_stack_name: betleague
betleague_runtime_group: "{{ ansible_user | default('betleague') }}"
betleague_swarm_deploy_path: "{{ betleague_compose_root }}/swarm"
betleague_swarm_backend_image: ""
betleague_swarm_frontend_image: ""
betleague_swarm_gunicorn_workers: 2
betleague_swarm_gunicorn_forwarded_allow_ips: "*"
betleague_swarm_python_temp: /dev/shm
betleague_swarm_python_tmp: /dev/shm
betleague_swarm_edge_acme_webroot: "{{ betleague_compose_root }}/shared/acme-challenge"
betleague_swarm_edge_tls_dir: "{{ betleague_compose_root }}/shared/tls/edge"
betleague_swarm_edge_tls_gid: 940
betleague_swarm_app_domain: app.betleague.app
betleague_swarm_api_domain: api.betleague.app
betleague_swarm_grafana_domain: grafana.betleague.app
betleague_swarm_prometheus_domain: prometheus.betleague.app
betleague_swarm_api_healthcheck_url: "https://{{ betleague_swarm_api_domain }}/health"
betleague_swarm_frontend_healthcheck_url: "https://{{ betleague_swarm_app_domain }}/"
betleague_swarm_grafana_healthcheck_url: "https://{{ betleague_swarm_grafana_domain }}/login"
betleague_swarm_prometheus_healthcheck_url: "https://{{ betleague_swarm_prometheus_domain }}/-/ready"
betleague_swarm_prometheus_scrape_interval: 30s
betleague_swarm_prometheus_evaluation_interval: 30s
betleague_swarm_prometheus_retention_time: 7d
betleague_swarm_monitoring_allowlist_cidrs: ""
betleague_swarm_registry_server: ""
betleague_swarm_registry_username: ""
betleague_swarm_registry_password: ""
betleague_swarm_backend_env_content: ""
betleague_swarm_migrations_env_content: ""
betleague_swarm_grafana_admin_password: ""
betleague_swarm_monitoring_htpasswd: ""
betleague_swarm_alertmanager_config_content: ""
betleague_swarm_redis_password: ""
betleague_swarm_nats_user: ""
betleague_swarm_nats_password: ""
betleague_swarm_nats_ca_cert: ""
betleague_swarm_nats_server_cert: ""
betleague_swarm_nats_server_key: ""
betleague_swarm_nats_client_cert: ""
betleague_swarm_nats_client_key: ""
betleague_swarm_release_worker_services:
  - celery_worker
  - celery_beat
  - outbox_worker
betleague_swarm_update_failure_action: pause
betleague_swarm_wait_timeout_seconds: 180
betleague_swarm_wait_sleep_seconds: 5
betleague_swarm_diagnostics_logs_since: 30m
betleague_swarm_diagnostics_logs_tail: 120







