---
- name: Déployer la stack BetLeague sur Docker Swarm
  hosts: betleague_vps3
  become: true
  gather_facts: true

  roles:
    - role: swarm_host
    - role: edge_tls
    - role: swarm_stack

  post_tasks:
    - name: Obtenir ou renouveler le certificat Let's Encrypt edge
      ansible.builtin.include_role:
        name: edge_tls
        tasks_from: issue.yml

    - name: Vérifier la santé HTTPS finale de l'API après émission TLS
      ansible.builtin.uri:
        url: "{{ betleague_swarm_api_healthcheck_url }}"
        method: GET
        return_content: false
        status_code: 200
        validate_certs: "{{ not (betleague_letsencrypt_staging | default(false) | bool) }}"
      register: betleague_swarm_api_tls_health
      retries: 12
      delay: 5
      until: betleague_swarm_api_tls_health.status == 200
      delegate_to: localhost
      become: false
      when: betleague_letsencrypt_enabled | default(false) | bool



