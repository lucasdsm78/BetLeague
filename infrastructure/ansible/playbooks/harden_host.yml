---
- name: Hardening sécurisé de l'hôte BetLeague VPS-3
  hosts: betleague_vps3
  become: true
  gather_facts: true

  pre_tasks:
    - name: Vérifier les CIDR SSH de confiance
      ansible.builtin.assert:
        that:
          - betleague_ssh_trusted_cidrs | length > 0
          - betleague_ssh_trusted_cidrs | map('regex_search', '^[0-9a-fA-F:.]+/[0-9]{1,3}$') | list | select('equalto', None) | list | length == 0
        fail_msg: >-
          Renseigne au moins un CIDR de confiance dans `betleague_ssh_trusted_cidrs`
          avant d'appliquer le hardening. Exemple: 203.0.113.10/32

    - name: Vérifier les ports publics autorisés
      ansible.builtin.assert:
        that:
          - betleague_public_tcp_ports | difference([80, 443]) | length == 0
        fail_msg: >-
          `betleague_public_tcp_ports` est volontairement limité à 80 et 443
          pour réduire la surface d'exposition.

  roles:
    - role: base_hardening
    - role: docker_host
    - role: app_host

