---
- name: Hardening sécurisé de l'hôte BetLeague VPS-3
  hosts: betleague_vps3
  become: true
  gather_facts: true

  pre_tasks:
    - name: Vérifier les CIDR SSH de confiance
      ansible.builtin.assert:
        that:
          - betleague_ssh_trusted_cidrs | length > 0
          - betleague_ssh_trusted_cidrs | map('regex_search', '^[0-9a-fA-F:.]+/[0-9]{1,3}$') | list | select('equalto', None) | list | length == 0
        fail_msg: >-
          Renseigne au moins un CIDR de confiance dans `betleague_ssh_trusted_cidrs`
          avant d'appliquer le hardening. Exemple: 203.0.113.10/32

    - name: Vérifier les ports publics autorisés
      ansible.builtin.assert:
        that:
          - betleague_public_tcp_ports | difference([80, 443]) | length == 0
        fail_msg: >-
          `betleague_public_tcp_ports` est volontairement limité à 80 et 443
          pour réduire la surface d'exposition.

  roles:
    - role: base_hardening
    - role: docker_host
    - role: app_host

  post_tasks:
    - name: Lire l'état UFW final
      ansible.builtin.command: ufw status verbose
      changed_when: false
      register: betleague_ufw_status

    - name: Vérifier qu'UFW est actif avec les politiques attendues
      ansible.builtin.assert:
        that:
          - "'Status: active' in betleague_ufw_status.stdout"
          - "'Default: deny (incoming), allow (outgoing), deny (routed)' in betleague_ufw_status.stdout"
        fail_msg: >-
          `ufw status verbose` ne reflète pas les politiques attendues BetLeague.

    - name: Vérifier la présence des règles SSH restreintes dans UFW
      ansible.builtin.assert:
        that:
          - >-
            (
              (
                betleague_ufw_status.stdout_lines
                | select('search', '(?:^|\\s)' ~ (betleague_ssh_port | string) ~ '(?:/tcp)?(?:\\s|$)')
                | select('search', 'LIMIT IN')
                | select('search', (item | regex_escape))
                | list
                | length
              ) > 0
            ) or (
              (
                (item | regex_search('/(?:32|128)$')) is not none
              ) and (
                (
                  betleague_ufw_status.stdout_lines
                  | select('search', '(?:^|\\s)' ~ (betleague_ssh_port | string) ~ '(?:/tcp)?(?:\\s|$)')
                  | select('search', 'LIMIT IN')
                  | select('search', ((item | regex_replace('/(?:32|128)$', '')) | regex_escape))
                  | list
                  | length
                ) > 0
              )
            )
        fail_msg: >-
          La règle UFW SSH attendue pour `{{ item }}` sur le port `{{ betleague_ssh_port }}` est absente
          ou affichée dans un format inattendu par `ufw status verbose`.
      loop: "{{ betleague_ssh_trusted_cidrs }}"

    - name: Vérifier la présence des règles UFW IPv4 sur les ports publics
      ansible.builtin.assert:
        that:
          - >-
            (betleague_ufw_status.stdout | regex_search(
            '(?m)^' ~ (item | string) ~ '/tcp\\s+ALLOW IN\\s+Anywhere(?:\\s|$)'
            )) is not none
        fail_msg: >-
          La règle UFW IPv4 attendue pour le port `{{ item }}` est absente.
      loop: "{{ betleague_public_tcp_ports }}"

    - name: Vérifier la présence des règles UFW IPv6 sur les ports publics
      ansible.builtin.assert:
        that:
          - >-
            (betleague_ufw_status.stdout | regex_search(
            '(?m)^' ~ (item | string) ~ '/tcp(?:\\s+\\(v6\\))?\\s+ALLOW IN\\s+Anywhere \\(v6\\)(?:\\s|$)'
            )) is not none
        fail_msg: >-
          La règle UFW IPv6 attendue pour le port `{{ item }}` est absente
          ou affichée dans un format inattendu par `ufw status verbose`.
      loop: "{{ betleague_public_tcp_ports }}"
      when: betleague_ufw_ipv6 | bool

    - name: Lire l'état de la prison Fail2ban SSHD
      ansible.builtin.command: fail2ban-client status sshd
      changed_when: false
      register: betleague_fail2ban_sshd_status
      when: betleague_enable_fail2ban | bool

    - name: Vérifier que la prison Fail2ban SSHD est active
      ansible.builtin.assert:
        that:
          - "'Status for the jail: sshd' in betleague_fail2ban_sshd_status.stdout"
          - "'Currently banned:' in betleague_fail2ban_sshd_status.stdout"
        fail_msg: >-
          La prison Fail2ban `sshd` n'est pas active comme attendu.
      when: betleague_enable_fail2ban | bool

    - name: Lire l'état de la prison Fail2ban recidive
      ansible.builtin.command: fail2ban-client status recidive
      changed_when: false
      register: betleague_fail2ban_recidive_status
      when:
        - betleague_enable_fail2ban | bool
        - betleague_fail2ban_recidive_enabled | bool

    - name: Vérifier que la prison Fail2ban recidive est active
      ansible.builtin.assert:
        that:
          - "'Status for the jail: recidive' in betleague_fail2ban_recidive_status.stdout"
          - "'Currently banned:' in betleague_fail2ban_recidive_status.stdout"
        fail_msg: >-
          La prison Fail2ban `recidive` n'est pas active comme attendu.
      when:
        - betleague_enable_fail2ban | bool
        - betleague_fail2ban_recidive_enabled | bool






