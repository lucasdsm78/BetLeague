x-service-defaults: &service-defaults
  init: true
  read_only: true
  dns:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
  cap_drop:
    - ALL
  stop_grace_period: 15s
  tmpfs:
    - /tmp:size=64m,mode=1777,noexec,nosuid
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-deploy-defaults: &deploy-defaults
  placement:
    constraints:
      - node.role == manager
      - node.labels.betleague.role == manager
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
    window: 60s
  update_config:
    parallelism: 1
    delay: 10s
    failure_action: ${BETLEAGUE_SWARM_UPDATE_FAILURE_ACTION:-pause}
    monitor: 30s
    order: start-first
  rollback_config:
    parallelism: 1
    delay: 5s
    order: stop-first

x-secret-redis-password: &secret-redis-password
  source: redis_password
  target: redis_password
  uid: "999"
  gid: "1000"
  mode: 0400

x-secret-nats-user: &secret-nats-user
  source: nats_user
  target: nats_user
  uid: "65534"
  gid: "65534"
  mode: 0400

x-secret-nats-password: &secret-nats-password
  source: nats_password
  target: nats_password
  uid: "65534"
  gid: "65534"
  mode: 0400

x-secret-nats-ca-cert-server: &secret-nats-ca-cert-server
  source: nats_ca_cert
  target: ca-cert.pem
  uid: "65534"
  gid: "65534"
  mode: 0400

x-secret-nats-server-cert: &secret-nats-server-cert
  source: nats_server_cert
  target: server-cert.pem
  uid: "65534"
  gid: "65534"
  mode: 0400

x-secret-nats-server-key: &secret-nats-server-key
  source: nats_server_key
  target: server-key.pem
  uid: "65534"
  gid: "65534"
  mode: 0400

x-secret-backend-env: &secret-backend-env
  source: backend_env
  target: backend_env
  uid: "1000"
  gid: "1000"
  mode: 0400

x-secret-migrations-env: &secret-migrations-env
  source: migrations_env
  target: migrations_env
  uid: "1000"
  gid: "1000"
  mode: 0400

x-secret-postgres-superuser-password: &secret-postgres-superuser-password
  source: postgres_superuser_password
  target: postgres_superuser_password
  uid: "0"
  gid: "999"
  mode: 0440

x-secret-postgres-app-password: &secret-postgres-app-password
  source: postgres_app_password
  target: postgres_app_password
  uid: "0"
  gid: "999"
  mode: 0440

x-secret-postgres-migrations-password: &secret-postgres-migrations-password
  source: postgres_migrations_password
  target: postgres_migrations_password
  uid: "0"
  gid: "999"
  mode: 0440

x-secret-grafana-admin-password: &secret-grafana-admin-password
  source: grafana_admin_password
  target: grafana_admin_password
  uid: "472"
  gid: "0"
  mode: 0400

x-secret-grafana-secret-key: &secret-grafana-secret-key
  source: grafana_secret_key
  target: grafana_secret_key
  uid: "472"
  gid: "0"
  mode: 0400

x-secret-monitoring-htpasswd: &secret-monitoring-htpasswd
  source: monitoring_htpasswd
  target: monitoring_htpasswd
  uid: "101"
  gid: "101"
  mode: 0400

x-secret-alertmanager-config: &secret-alertmanager-config
  source: alertmanager_config
  target: alertmanager.yml
  uid: "65534"
  gid: "65534"
  mode: 0400

x-secret-nats-ca-cert-client: &secret-nats-ca-cert-client
  source: nats_ca_cert
  target: ca-cert.pem
  uid: "1000"
  gid: "1000"
  mode: 0400

x-secret-nats-client-cert: &secret-nats-client-cert
  source: nats_client_cert
  target: client-cert.pem
  uid: "1000"
  gid: "1000"
  mode: 0400

x-secret-nats-client-key: &secret-nats-client-key
  source: nats_client_key
  target: client-key.pem
  uid: "1000"
  gid: "1000"
  mode: 0400

services:
  edge:
    <<: *service-defaults
    image: nginxinc/nginx-unprivileged:1.27-alpine
    read_only: false
    user: "101:${BETLEAGUE_EDGE_TLS_GID:-940}"
    ports:
      - target: 8080
        published: 80
        protocol: tcp
        mode: host
      - target: 8443
        published: 443
        protocol: tcp
        mode: host
    configs:
      - source: edge_nginx_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0444
    volumes:
      - type: bind
        source: ${BETLEAGUE_EDGE_ACME_WEBROOT:?BETLEAGUE_EDGE_ACME_WEBROOT is required}
        target: /var/www/letsencrypt
        read_only: true
      - type: bind
        source: ${BETLEAGUE_EDGE_TLS_DIR:?BETLEAGUE_EDGE_TLS_DIR is required}
        target: /etc/nginx/tls
        read_only: true
    secrets:
      - *secret-monitoring-htpasswd
    networks:
      - edge
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      <<: *deploy-defaults
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: ${BETLEAGUE_SWARM_UPDATE_FAILURE_ACTION:-pause}
        monitor: 30s
        order: stop-first
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 200
        reservations:
          memory: 64M

  frontend:
    <<: *service-defaults
    image: ${BETLEAGUE_FRONTEND_IMAGE:?BETLEAGUE_FRONTEND_IMAGE is required}
    read_only: false
    user: "101:101"
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      <<: *deploy-defaults
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 200
        reservations:
          memory: 64M

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v2.54.1
    read_only: false
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${BETLEAGUE_PROMETHEUS_RETENTION_TIME:-7d}
      - --storage.tsdb.retention.size=${BETLEAGUE_PROMETHEUS_RETENTION_SIZE:-4GB}
      - --storage.tsdb.wal-compression
      - --query.timeout=30s
      - --query.max-concurrency=10
      - --web.max-connections=64
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    configs:
      - source: prometheus_conf
        target: /etc/prometheus/prometheus.yml
        mode: 0444
      - source: prometheus_alerts
        target: /etc/prometheus/rules/prometheus-alerts.yml
        mode: 0444
    volumes:
      - prometheus_data:/prometheus
    networks:
      - app
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      <<: *deploy-defaults
      replicas: 1
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
          pids: 200
        reservations:
          memory: 256M

  grafana:
    <<: *service-defaults
    image: grafana/grafana:11.1.4
    read_only: false
    environment:
      GF_SERVER_DOMAIN: ${BETLEAGUE_GRAFANA_DOMAIN:?BETLEAGUE_GRAFANA_DOMAIN is required}
      GF_SERVER_ENFORCE_DOMAIN: "true"
      GF_SERVER_ROOT_URL: https://${BETLEAGUE_GRAFANA_DOMAIN:?BETLEAGUE_GRAFANA_DOMAIN is required}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_SECRET_KEY__FILE: /run/secrets/grafana_secret_key
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      GF_SECURITY_X_CONTENT_TYPE_OPTIONS: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_USERS_EDITORS_CAN_ADMIN: "false"
      GF_EXPLORE_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_SNAPSHOTS_PUBLIC_MODE: "false"
      GF_SMTP_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/system-overview.json
    secrets:
      - *secret-grafana-admin-password
      - *secret-grafana-secret-key
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
        mode: 0444
      - source: grafana_dashboards
        target: /etc/grafana/provisioning/dashboards/default.yml
        mode: 0444
      - source: grafana_system_overview_dashboard
        target: /etc/grafana/provisioning/dashboards/system-overview.json
        mode: 0444
      - source: grafana_league_payout_overdue_dashboard
        target: /etc/grafana/provisioning/dashboards/league-payout-overdue.json
        mode: 0444
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      <<: *deploy-defaults
      replicas: 1
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
          pids: 200
        reservations:
          memory: 128M

  alertmanager:
    <<: *service-defaults
    image: prom/alertmanager:v0.27.0
    read_only: false
    command:
      - --config.file=/run/secrets/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    secrets:
      - *secret-alertmanager-config
    volumes:
      - alertmanager_data:/alertmanager
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      <<: *deploy-defaults
      replicas: ${BETLEAGUE_ALERTMANAGER_REPLICAS:-1}
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
          pids: 200
        reservations:
          memory: 64M

  node_exporter:
    <<: *service-defaults
    image: prom/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+|run/docker/netns/.+)($$|/)
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
      - type: bind
        source: /
        target: /host/root
        read_only: true
    networks:
      - monitoring
    deploy:
      <<: *deploy-defaults
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 200
        reservations:
          memory: 32M

  cadvisor:
    <<: *service-defaults
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    read_only: false
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --max_housekeeping_interval=60s
      - --store_container_labels=false
      - --disable_metrics=advtcp,app,cpu_topology,disk,diskIO,memory_numa,network,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: bind
        source: /sys
        target: /sys
        read_only: true
      - type: bind
        source: /var/lib/docker
        target: /var/lib/docker
        read_only: true
    networks:
      - monitoring
    deploy:
      <<: *deploy-defaults
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 200
        reservations:
          memory: 64M

  postgres:
    <<: *service-defaults
    image: ${BETLEAGUE_POSTGRES_IMAGE:-postgres:16}
    read_only: false
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${BETLEAGUE_POSTGRES_DATABASE:?BETLEAGUE_POSTGRES_DATABASE is required}
      POSTGRES_USER: ${BETLEAGUE_POSTGRES_SUPERUSER:?BETLEAGUE_POSTGRES_SUPERUSER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - *secret-postgres-superuser-password
      - *secret-postgres-app-password
      - *secret-postgres-migrations-password
    configs:
      - source: postgres_init_betleague
        target: /docker-entrypoint-initdb.d/010-betleague-init.sh
        mode: 0555
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - export PGPASSWORD="$$(cat /run/secrets/postgres_superuser_password)" && pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      <<: *deploy-defaults
      replicas: ${BETLEAGUE_INTERNAL_POSTGRES_REPLICAS:-1}
      placement:
        constraints:
          - node.role == manager
          - node.labels.betleague.role == manager
          - ${BETLEAGUE_POSTGRES_PLACEMENT_CONSTRAINT:?BETLEAGUE_POSTGRES_PLACEMENT_CONSTRAINT is required}
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: ${BETLEAGUE_SWARM_UPDATE_FAILURE_ACTION:-pause}
        monitor: 30s
        order: stop-first
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
          pids: 400
        reservations:
          memory: 512M

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    read_only: false
    user: "999:1000"
    stop_grace_period: 30s
    command:
      - sh
      - -ec
      - |
        export REDIS_PASSWORD="$$(cat /run/secrets/redis_password)"
        test -n "$$REDIS_PASSWORD"
        redis_password_sha256=$$(printf '%s' "$$REDIS_PASSWORD" | sha256sum | awk '{print $$1}')

        cat > /data/users.acl <<EOF
        user default off
        user notif on #$$redis_password_sha256 +ping +hello +client|id +client|setinfo +auth +quit +publish +subscribe +psubscribe +unsubscribe +punsubscribe +pubsub +get +set +setex +del +expire +eval +evalsha +script|load +incrby +zadd +zcard +zrange +zremrangebyscore ~betleague:pwdreset:* ~betleague:notifications:user:* ~betleague:auth:* ~ratelimit:* &betleague:notifications:user:*
        user celery on #$$redis_password_sha256 +@all ~* &*
        EOF

        cat > /data/redis.conf <<EOF
        save ""
        appendonly no
        aclfile /data/users.acl
        maxmemory 256mb
        maxmemory-policy allkeys-lru
        protected-mode yes
        bind 0.0.0.0
        port 6379
        EOF

        exec redis-server /data/redis.conf
    secrets:
      - *secret-redis-password
    configs:
      - source: redis_conf_template
        target: /etc/redis/redis.conf.template
        mode: 0444
    volumes:
      - redis_data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 6379 --user notif --pass \"$$(cat /run/secrets/redis_password)\" --raw ping | grep -x PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      <<: *deploy-defaults
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: ${BETLEAGUE_SWARM_UPDATE_FAILURE_ACTION:-pause}
        monitor: 30s
        order: stop-first
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
          pids: 200
        reservations:
          memory: 96M

  nats:
    <<: *service-defaults
    image: nats:2.10-alpine
    user: "65534:65534"
    stop_grace_period: 30s
    command:
      - sh
      - -ec
      - |
        exec nats-server \
          -c /etc/nats/nats-server.conf \
          --user "$$(cat /run/secrets/nats_user)" \
          --pass "$$(cat /run/secrets/nats_password)"
    secrets:
      - *secret-nats-user
      - *secret-nats-password
      - *secret-nats-ca-cert-server
      - *secret-nats-server-cert
      - *secret-nats-server-key
    configs:
      - source: nats_server_conf
        target: /etc/nats/nats-server.conf
        mode: 0444
    volumes:
      - nats_data:/var/tmp
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      <<: *deploy-defaults
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: ${BETLEAGUE_SWARM_UPDATE_FAILURE_ACTION:-pause}
        monitor: 30s
        order: stop-first
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
          pids: 200
        reservations:
          memory: 128M

  jetstream_provision:
    <<: *service-defaults
    image: ${BETLEAGUE_BACKEND_IMAGE:?BETLEAGUE_BACKEND_IMAGE is required}
    user: "1000:1000"
    environment:
      TMPDIR: ${BETLEAGUE_PYTHON_TEMP:?BETLEAGUE_PYTHON_TEMP is required}
      TEMP: ${BETLEAGUE_PYTHON_TEMP:?BETLEAGUE_PYTHON_TEMP is required}
      TMP: ${BETLEAGUE_PYTHON_TMP:?BETLEAGUE_PYTHON_TMP is required}
    command:
      - python
      - scripts/run_with_env_files.py
      - /run/secrets/backend_env
      - --
      - python
      - scripts/provision_jetstream_streams.py
    secrets:
      - *secret-backend-env
      - *secret-nats-ca-cert-client
      - *secret-nats-client-cert
      - *secret-nats-client-key
    networks:
      - app
    deploy:
      placement:
        constraints:
          - node.role == manager
          - node.labels.betleague.role == manager
      replicas: 1
      restart_policy:
        condition: none
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
          pids: 200
        reservations:
          memory: 64M

  migrations:
    <<: *service-defaults
    image: ${BETLEAGUE_BACKEND_IMAGE:?BETLEAGUE_BACKEND_IMAGE is required}
    user: "1000:1000"
    environment:
      TMPDIR: ${BETLEAGUE_PYTHON_TEMP:?BETLEAGUE_PYTHON_TEMP is required}
      TEMP: ${BETLEAGUE_PYTHON_TEMP:?BETLEAGUE_PYTHON_TEMP is required}
      TMP: ${BETLEAGUE_PYTHON_TMP:?BETLEAGUE_PYTHON_TMP is required}
    command:
      - python
      - scripts/run_with_env_files.py
      - /run/secrets/backend_env
      - /run/secrets/migrations_env
      - --
      - ./scripts/run_migrations.sh
    secrets:
      - *secret-backend-env
      - *secret-migrations-env
      - *secret-nats-ca-cert-client
      - *secret-nats-client-cert
      - *secret-nats-client-key
    networks:
      - app
    deploy:
      placement:
        constraints:
          - node.role == manager
          - node.labels.betleague.role == manager
      replicas: 0
      restart_policy:
        condition: none
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
          pids: 200
        reservations:
          memory: 128M

  backend:
    <<: *service-defaults
    image: ${BETLEAGUE_BACKEND_IMAGE:?BETLEAGUE_BACKEND_IMAGE is required}
    user: "1000:1000"
    stop_grace_period: 20s
    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS-}
      GUNICORN_FORWARDED_ALLOW_IPS: ${GUNICORN_FORWARDED_ALLOW_IPS-*}
      GUNICORN_WORKER_TMP_DIR: ${BETLEAGUE_PYTHON_TMP:?BETLEAGUE_PYTHON_TMP is required}
      PROMETHEUS_MULTIPROC_DIR: ${BETLEAGUE_PYTHON_TMP:?BETLEAGUE_PYTHON_TMP is required}/prometheus-multiproc
      TMPDIR: ${BETLEAGUE_PYTHON_TEMP:?BETLEAGUE_PYTHON_TEMP is required}
      TEMP: ${BETLEAGUE_PYTHON_TEMP:?BETLEAGUE_PYTHON_TEMP is required}
      TMP: ${BETLEAGUE_PYTHON_TMP:?BETLEAGUE_PYTHON_TMP is required}
    command:
      - python
      - scripts/run_with_env_files.py
      - /run/secrets/backend_env
      - --
      - sh
      - -ec
      - |
        export GUNICORN_WORKERS="$${GUNICORN_WORKERS:-$${UVICORN_WORKERS:-2}}"
        exec gunicorn -c /app/gunicorn.conf.py main:app
    secrets:
      - *secret-backend-env
      - *secret-nats-ca-cert-client
      - *secret-nats-client-cert
      - *secret-nats-client-key
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/ready', headers={'Host': '${BETLEAGUE_API_DOMAIN:?BETLEAGUE_API_DOMAIN is required}'}); urllib.request.urlopen(req, timeout=3).read()\""]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      <<: *deploy-defaults
      replicas: 2
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: ${BETLEAGUE_SWARM_UPDATE_FAILURE_ACTION:-pause}
        monitor: 45s
        order: start-first
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
          pids: 200
        reservations:
          memory: 256M

  celery_worker:
    <<: *service-defaults
    image: ${BETLEAGUE_BACKEND_IMAGE:?BETLEAGUE_BACKEND_IMAGE is required}
    user: "1000:1000"
    stop_grace_period: 20s
    environment:
      TMPDIR: ${BETLEAGUE_PYTHON_TEMP:?BETLEAGUE_PYTHON_TEMP is required}
      TEMP: ${BETLEAGUE_PYTHON_TEMP:?BETLEAGUE_PYTHON_TEMP is required}
      TMP: ${BETLEAGUE_PYTHON_TMP:?BETLEAGUE_PYTHON_TMP is required}
    command:
      - python
      - scripts/run_with_env_files.py
      - /run/secrets/backend_env
      - --
      - celery
      - -A
      - infrastructure.celery.celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
    secrets:
      - *secret-backend-env
    networks:
      - app
    deploy:
      <<: *deploy-defaults
      replicas: 2
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
          pids: 200
        reservations:
          memory: 192M

  celery_beat:
    <<: *service-defaults
    image: ${BETLEAGUE_BACKEND_IMAGE:?BETLEAGUE_BACKEND_IMAGE is required}
    user: "1000:1000"
    stop_grace_period: 20s
    environment:
      TMPDIR: ${BETLEAGUE_PYTHON_TEMP:?BETLEAGUE_PYTHON_TEMP is required}
      TEMP: ${BETLEAGUE_PYTHON_TEMP:?BETLEAGUE_PYTHON_TEMP is required}
      TMP: ${BETLEAGUE_PYTHON_TMP:?BETLEAGUE_PYTHON_TMP is required}
    command:
      - python
      - scripts/run_with_env_files.py
      - /run/secrets/backend_env
      - --
      - celery
      - -A
      - infrastructure.celery.celery_app
      - beat
      - --loglevel=info
      - --schedule
      - /var/lib/celery/celerybeat-schedule
    secrets:
      - *secret-backend-env
    volumes:
      - celery_beat_schedule:/var/lib/celery
    networks:
      - app
    deploy:
      <<: *deploy-defaults
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
          pids: 200
        reservations:
          memory: 128M

  outbox_worker:
    <<: *service-defaults
    image: ${BETLEAGUE_BACKEND_IMAGE:?BETLEAGUE_BACKEND_IMAGE is required}
    user: "1000:1000"
    stop_grace_period: 20s
    environment:
      TMPDIR: ${BETLEAGUE_PYTHON_TEMP:?BETLEAGUE_PYTHON_TEMP is required}
      TEMP: ${BETLEAGUE_PYTHON_TEMP:?BETLEAGUE_PYTHON_TEMP is required}
