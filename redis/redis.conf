# Redis configuration - BetLeague
# Sécurité: pas de persistence (pour notifications realtime), mot de passe + ACL default
save ""
appendonly no

# ACL: active l'utilisateur default avec mot de passe fourni via requirepass
# NOTE: redis.conf ne supporte pas les variables d'env. On met le password ici via env file en prod,
# ou on override ce fichier dans ton infra de déploiement.
# Pour le dev compose, on garde un mot de passe par défaut.
requirepass dev_redis_password_change_me
user default on >dev_redis_password_change_me +@all ~* &*

# Perf/sûreté (évite OOM)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Networking
protected-mode yes
bind 0.0.0.0
port 6379

# NOTE: ce fichier est conservé comme exemple, mais docker-compose utilise désormais `redis.conf.template`
